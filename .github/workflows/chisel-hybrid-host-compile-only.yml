name: TEMP hybrid Host source compilation only
on:
  push:
    branches: [main]
    paths:
      - candidates/chisel_hybrid_host_20261106/**
      - .github/workflows/chisel-hybrid-host-compile-only.yml
permissions:
  contents: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  source_compile_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact portable source selection
        timeout-minutes: 2
        run: |
          python3 -I -B candidates/chisel_hybrid_host_20261106/compile_only.py --check-only
          python3 -I -B candidates/chisel_hybrid_host_20261106/test_compile_only.py
          python3 -I -B -O candidates/chisel_hybrid_host_20261106/test_compile_only.py
      - name: Compile only; no elaboration, native loading, profiles or uploads
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$JAVA_HOME_21_X64"
          python3 -I -B candidates/chisel_hybrid_host_20261106/compile_only.py \
            --java "$JAVA_HOME_21_X64/bin/java" \
            --output "$RUNNER_TEMP/hybrid-source-compile-only"
