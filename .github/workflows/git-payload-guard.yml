name: reject-rebuildable-git-payloads
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-payload-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_git_payloads.py
      - run: python -m pip install pytest
      - run: python -m pytest -o addopts='' -q tests/test_git_payload_guard.py
      - run: python -O -m pytest -o addopts='' -q tests/test_git_payload_guard.py
