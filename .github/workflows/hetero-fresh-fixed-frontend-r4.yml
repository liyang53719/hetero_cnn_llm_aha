name: hetero-fresh-fixed-frontend-r4-only
on:
  push:
    branches: [main]
    paths: [ci_launch/fixed_frontend_r4_20261029_once.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Validate unique launch commit and source identity
        id: launch
        run: python3 -B candidates/ci_frontend_materialization_r2_20261029/validate_r4_one_shot_launch.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.launch.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bounded fresh source to physical frontend only
        env:
          REVIEWED_SHA: ${{ steps.launch.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B candidates/ci_frontend_materialization_r2_20261029/bootstrap_frontend.py \
            --repo "$GITHUB_WORKSPACE" \
            --pipeline "$GITHUB_WORKSPACE/candidates/ci_frontend_pipeline_r2_20261029" \
            --work "$RUNNER_TEMP/hetero-frontend" \
            --reviewed-repo-sha "$REVIEWED_SHA" --execute-reviewed-once
      - name: Produce bounded summary only
        if: ${{ always() && steps.launch.outputs.source_sha != '' }}
        env:
          REVIEWED_SHA: ${{ steps.launch.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 -B candidates/ci_frontend_materialization_r2_20261029/summarize_frontend.py \
            --work "$RUNNER_TEMP/hetero-frontend" --commit "$REVIEWED_SHA" \
            --output "$RUNNER_TEMP/frontend-only-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.launch.outputs.source_sha != '' }}
        with:
          name: frontend-only-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-only-summary.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
# Source publication does not include the launch path and does not start a job.
# Launch is a separately reviewed one-file added commit directly atop source SHA.
