name: hetero-observer-fixed4096-old-new-sv-only-difference
on:
  push:
    branches: [main]
    paths: [ci_launch/observer_fixed4096_sv_only_difference_20261031_fileinfo_once.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  sv_only_difference:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record whole job clock before checkout
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, pathlib, time
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hetero-observer-sv-only-job-start.json'
          with p.open('x') as f:
              json.dump(dict(schema='SAME_JOB_START_V1', started_monotonic=time.monotonic(), run_id=int(os.environ['GITHUB_RUN_ID']), launch_commit=os.environ['GITHUB_SHA'], job_budget_seconds=10800), f, sort_keys=True)
              f.write('\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Validate unique first-attempt direct-parent launch
        id: launch
        timeout-minutes: 1
        run: python3 -B candidates/observer_sv_only_20261030/validate_launch.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 5
        with:
          ref: ${{ steps.launch.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Full4096 old and new original155 SV-only reconstruction
        id: qualification
        timeout-minutes: 129
        run: |
          set -euo pipefail
          python3 -B candidates/observer_sv_only_20261030/prepare_and_run.py \
            --repo "$GITHUB_WORKSPACE" \
            --identity "$RUNNER_TEMP/hetero-observer-sv-only-identity.json" \
            --job-start "$RUNNER_TEMP/hetero-observer-sv-only-job-start.json" \
            --work "$RUNNER_TEMP/hetero-observer-sv-only" \
            --execute-reviewed-once
      - name: Export bounded two-module proof and sanitized stage receipts
        id: summary
        if: ${{ always() && steps.launch.outputs.source_sha != '' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -B candidates/observer_sv_only_20261030/export_metadata.py \
            --repo "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/hetero-observer-sv-only" \
            --identity "$RUNNER_TEMP/hetero-observer-sv-only-identity.json" \
            --job-start "$RUNNER_TEMP/hetero-observer-sv-only-job-start.json" \
            --output "$RUNNER_TEMP/observer-sv-only-metadata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.launch.outputs.source_sha != '' && steps.summary.outcome == 'success' }}
        timeout-minutes: 5
        with:
          name: hetero-observer-sv-only-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/observer-sv-only-metadata/sv-only-summary.json
            ${{ runner.temp }}/observer-sv-only-metadata/sv-only-proof.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
# No activation in source publication; direct-parent unique single-file launch only.
# Whole10800 from first step; internal15 phase walls6360+cleanup450+parent900=7710.
# Step129min=7740 (30s outer rounding); workflow1320 =>9060, whole reserve1740.
# No Verilator/GCC/providers/archive/link/weights/ref/DUT. No raw SV/IR/class upload.
# SV re-pin and numeric acceptance remain false, including positive projection.
