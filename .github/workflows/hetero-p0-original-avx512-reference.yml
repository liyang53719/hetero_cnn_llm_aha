name: hetero-p0-original-avx512-reference-only
on:
  push:
    branches: [main]
    paths: [ci_launch/p0_original_avx512_reference_20261103_once.json]
permissions:
  contents: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  reference_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Start one original monotonic wall budget
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, pathlib, time
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p0-avx512-job-start.json'
          with p.open('x') as f:
              json.dump(dict(schema='P0_AVX512_JOB_START_V1', run_id=int(os.environ['GITHUB_RUN_ID']), launch_commit=os.environ['GITHUB_SHA'], started_monotonic=time.monotonic(), job_budget_seconds=3600), f)
              f.write('\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Admit independent AVX512 job preserving failed DEFAULT run41734412224
        id: launch
        run: python3 -S -B candidates/p0_original_avx512_reference_20261103/v1/validate_avx512_launch.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.launch.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Actual two full128 forwards then frozen 1024 RoPE gate, no hardware
        id: controller
        run: |
          set -euo pipefail
          python3 -S -B candidates/p0_original_avx512_reference_20261103/v1/run_portable.py \
            --repo "$GITHUB_WORKSPACE" \
            --identity "$RUNNER_TEMP/p0-avx512-identity.json" \
            --job-start "$RUNNER_TEMP/p0-avx512-job-start.json" \
            --output "$RUNNER_TEMP/p0-original-avx512-$GITHUB_RUN_ID"
      - name: Validate exact three bounded safe JSON files
        id: summary
        if: ${{ always() && steps.launch.outputs.source_sha != '' }}
        env:
          CONTROLLER_OUTCOME: ${{ steps.controller.outcome }}
        run: |
          set -euo pipefail
          python3 -S -B - <<'PY'
          import os, pathlib, sys
          source = pathlib.Path('candidates/p0_original_avx512_reference_20261103/v1').resolve()
          sys.path.insert(0, str(source))
          try:
              from export_seal import verify_sealed_export
              from fixture_gate import frozen, strict_json
              frozen()
              work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('p0-original-avx512-' + os.environ['GITHUB_RUN_ID'])
              identity = strict_json(pathlib.Path(os.environ['RUNNER_TEMP']) / 'p0-avx512-identity.json')
              verify_sealed_export(work, identity, source / 'FROZEN_P0.json', os.environ['CONTROLLER_OUTCOME'])
          except BaseException:
              raise SystemExit('EXPORT_SCHEMA') from None
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.summary.outcome == 'success' }}
        with:
          name: p0-original-avx512-safe-json-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p0-original-avx512-${{ github.run_id }}/export/RESULT.json
            ${{ runner.temp }}/p0-original-avx512-${{ github.run_id }}/export/CHECKS.json
            ${{ runner.temp }}/p0-original-avx512-${{ github.run_id }}/export/HOST_RESOURCES.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
# DORMANT_SOURCE: publication contains no ci_launch nonce or activation file.
# NO_PAYLOAD_UPLOAD: no binary, tensor, weights, SV, archive, raw log or encoding.
# Original AVX512 dispatch and newly admitted affinity; all original bytes rechecked.
# No DUT/build/provider/EDA step exists. Failure stops all later computational stages.

# New AVX512 once identity. Never retry old activations or fall back to DEFAULT.
# Actual affinity-wide physical ISA admission precedes installation and calculation.
