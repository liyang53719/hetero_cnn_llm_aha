name: qwen35-production-Host-Attention-Block

# Frozen-recipe raw-hidden full Attention block: two processes, two actual M1
# launches each, retained prefix KV. Native full-block and full M128 stay open.
# No tensor/weight/NPZ/build artifact upload; only two compact JSON files.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-bf16-attention-block.yml'
      - 'chisel/continuous_prefill/**'
      - 'chisel/p0_safety/src/main/**'
      - 'integration/gemmini/EmitHeteroBF16Fma.scala'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'rtl/matrix/**'
      - 'rtl/integration/**'
      - 'rtl/sfu/**'
      - 'src/heteronpu/**'
      - 'config/model_profiles/qwen3_5_0p8b.json'
      - 'config/upstream/qwen3_5_0p8b/**'
      - 'scripts/collect_qwen35*payload.py'
      - 'scripts/*reference.c'
      - 'scripts/check_git_payloads.py'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-bf16-attention-block-${{ github.sha }}
  cancel-in-progress: false

jobs:
  representative-attention-block:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      BUILD_JOBS: '1'
      BUILD_RESERVE_BYTES: '1073741824'
      JVM_OPTS: '-Xmx1500m -Xss8m -XX:ActiveProcessorCount=2'
      SBT_OPTS: '-Dsbt.supershell=false -Dsbt.task.cpus=2'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: sbt/setup-sbt@v1
      - name: Prepare pinned tools, upstream iDMA and official source runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y verilator g++ make curl
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest PyYAML==6.0.3 numpy==2.3.5 uv==0.12.19 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
          bash chisel/continuous_prefill/scripts/prepare_host_ci_tools.sh "$GITHUB_WORKSPACE/work/attention_block_ci_tools"
          python chisel/continuous_prefill/scripts/prepare_pinned_idma_sources.py --output work/attention_block_ci_idma
          echo "IDMA_EXPORT=$GITHUB_WORKSPACE/work/attention_block_ci_idma/idma_export" >> "$GITHUB_ENV"
      - name: Source payload boundary and public descriptor regressions
        run: |
          python scripts/check_git_payloads.py
          python -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_qk_rope*.py chisel/continuous_prefill/tests/test_host_bf16_qkv*.py chisel/continuous_prefill/tests/test_prepare_qk_norm_rope_owner_fixture.py chisel/continuous_prefill/tests/test_host_bf16_attention_core*.py chisel/continuous_prefill/tests/test_host_bf16_attention_block*.py tests/test_host_bf16_attention_core_descriptor.py tests/test_host_bf16_attention_block_descriptor.py tests/test_host_bf16_attention_block_reference.py tests/test_attention_sigmoid_reference.py tests/test_qwen35_gqa_fixed_reference.py
          python -O -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_qk_rope*.py chisel/continuous_prefill/tests/test_host_bf16_qkv*.py chisel/continuous_prefill/tests/test_prepare_qk_norm_rope_owner_fixture.py chisel/continuous_prefill/tests/test_host_bf16_attention_core*.py chisel/continuous_prefill/tests/test_host_bf16_attention_block*.py tests/test_host_bf16_attention_core_descriptor.py tests/test_host_bf16_attention_block_descriptor.py tests/test_host_bf16_attention_block_reference.py tests/test_attention_sigmoid_reference.py tests/test_qwen35_gqa_fixed_reference.py
      - name: Shared Scalar and owner/frontend controls before production build
        working-directory: chisel/continuous_prefill
        env:
          MAKEFLAGS: '-j1 VM_PARALLEL_BUILDS=0 VK_PCH_I_FAST= VK_PCH_I_SLOW='
        run: |
          set -euo pipefail
          export ATTENTION_SIGMOID_FIXED_VECTORS="$GITHUB_WORKSPACE/work/attention_block_sigmoid_ci/fixed_vectors.json"
          python scripts/attention_sigmoid_reference.py --output "$ATTENTION_SIGMOID_FIXED_VECTORS"
          export ATTENTION_SIGMOID_FIXED_SHA256=$(sha256sum "$ATTENTION_SIGMOID_FIXED_VECTORS" | cut -d' ' -f1)
          sbt -batch -J-Xss8m 'testOnly heteronpu.continuous.BlockScalarFloatSpec heteronpu.continuous.QkNorm256OwnerSpec heteronpu.continuous.PartialRope64OwnerSpec heteronpu.continuous.HostQkNormRopeCommandsSpec heteronpu.continuous.HostAttentionCoreCommandsSpec heteronpu.continuous.HostAttentionBlockCommandsSpec heteronpu.continuous.AttentionSigmoidOwnerSpec heteronpu.continuous.Bf16KvAppendOwnerSpec heteronpu.continuous.Bf16CausalGqaOwnerSpec'
      - name: Reacquire only pinned layer0, layer3 and prefix sources
        run: |
          python scripts/collect_qwen35_layer0_payload.py --output work/qwen35_layer0_payload
          python scripts/collect_qwen35_layer3_payload.py --output work/qwen35_layer3_payload
          python scripts/collect_qwen35_prefix_payload.py --output work/qwen35_prefix_payload
      - name: Fresh independent reference and actual twenty-two-command cold0/carried1 block with final-residual ACK fault
        env: {HF_HUB_OFFLINE: '1'}
        run: |
          python chisel/continuous_prefill/scripts/run_host_bf16_attention_block_fresh_gate.py --output work/host_attention_block_fresh_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-attention-block-m1-proof-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            work/host_attention_block_fresh_ci/compact/summary.json
            work/host_attention_block_fresh_ci/compact/source_input_hashes.json
      - name: State the exact acceptance boundary
        run: |
          echo 'Production 22-command/296-descriptor/19-owner-job M1 block: raw hidden -> input RMS -> Q/gate,K,V -> C1 QK Norm -> B1 partial64 RoPE -> KV append -> causal GQA -> BF16 sigmoid times context -> O -> residual -> post RMS -> FFN gate/up -> SiLU times up -> down -> final residual -> terminal fence. 68608 acknowledged bytes per successful launch. Two same-DUT two-launch cases: pass and final-residual-ack-error, with actual cold0/carried1 prefix KV and shared full256x64 BF16 trig.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Frozen-recipe hardware equality only. Original official producer thresholds and native failures remain visible; native full-block PASS, full M128, reset/restore, timing and QoR signoff remain PENDING. One Matrix with 8 physical slices, one shared Scalar service and one pinned iDMA. Default off. No intermediate, golden or prior-cache preloads.' >> "$GITHUB_STEP_SUMMARY"
