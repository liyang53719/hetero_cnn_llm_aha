name: qwen35-production-Host-BF16-GDN-Block

# Fresh full-block canonical and original-native acceptance on one actual DUT.
# Native failure preserves canonical evidence but fails the overall CI gate.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-bf16-gdn-block.yml'
      - 'chisel/continuous_prefill/**'
      - 'chisel/p0_safety/src/main/**'
      - 'integration/gemmini/EmitHeteroBF16Fma.scala'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'rtl/matrix/**'
      - 'rtl/integration/**'
      - 'src/heteronpu/**'
      - 'config/model_profiles/qwen3_5_0p8b.json'
      - 'config/upstream/qwen3_5_0p8b/**'
      - 'scripts/collect_qwen35*payload.py'
      - 'scripts/matrix_norm_rope_reference.c'
      - 'scripts/check_git_payloads.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: host-bf16-gdn-block-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # BEGIN HOST_ATTENTION_BLOCK_CI_SCOPE
  host-attention-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
      - name: Classify exact Attention orchestration diff
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/host_attention_block_ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
  # END HOST_ATTENTION_BLOCK_CI_SCOPE
  build:
    needs: host-attention-scope
    if: ${{ always() && (needs.host-attention-scope.result != 'success' || needs.host-attention-scope.outputs.run_full != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      package_sha256: ${{ steps.build.outputs.package_sha256 }}
      source_commit: ${{ steps.build.outputs.source_commit }}
      artifact_name: host-gdn-block-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      BUILD_JOBS: '1'
      BUILD_RESERVE_BYTES: '1073741824'
      JVM_OPTS: '-Xmx1500m -Xss4M -XX:ActiveProcessorCount=2'
      SBT_OPTS: '-Dsbt.supershell=false -Dsbt.task.cpus=2'
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: sbt/setup-sbt@v1
      - name: Prepare pinned build tools and original public iDMA sources
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y verilator g++ make curl
          python -m pip install -e . pytest PyYAML==6.0.3 numpy==2.3.5 uv==0.12.19
          bash chisel/continuous_prefill/scripts/prepare_host_ci_tools.sh "$GITHUB_WORKSPACE/work/gdn_block_ci_tools"
          python chisel/continuous_prefill/scripts/prepare_pinned_idma_sources.py --output work/gdn_block_ci_idma
          echo "IDMA_EXPORT=$GITHUB_WORKSPACE/work/gdn_block_ci_idma/idma_export" >> "$GITHUB_ENV"
      - name: Source, v1/core/block ABI, fresh authority and transfer-admission regression
        run: |
          python scripts/check_git_payloads.py
          python -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_gdn*.py chisel/continuous_prefill/tests/test_gdn_*reference.py
          python -O -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_gdn*.py chisel/continuous_prefill/tests/test_gdn_*reference.py
      - name: Small scalar, v1 Conv and v1/core/block Host frontend control gates
        working-directory: chisel/continuous_prefill
        env:
          MAKEFLAGS: '-j1 VK_PCH_I_FAST= VK_PCH_I_SLOW='
        run: |
          sbt -batch 'testOnly heteronpu.continuous.BlockScalarFloatSpec heteronpu.continuous.GdnConv4OwnerSpec heteronpu.continuous.HostBlockCommandsGdnSpec heteronpu.continuous.HostBlockCommandsGdnCoreSpec heteronpu.continuous.HostBlockCommandsGdnBlockSpec'
      - name: Build block once and seal only ELF, RTL and source/tool identities
        id: build
        run: |
          python chisel/continuous_prefill/scripts/run_host_bf16_gdn_fresh_gate.py build --profile block --output work/host_gdn_block_build_ci --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: host-gdn-block-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: work/host_gdn_block_build_ci/host_gdn_build.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-gdn-block-build-proof-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            work/host_gdn_block_build_ci/compact/summary.json
            work/host_gdn_block_build_ci/compact/source_input_hashes.json

  block-canonical-native-pass:
    needs: build
    runs-on: ubuntu-24.04
    # Full-chain performance is unmeasured. A prior 42-command legacy run took
    # 3h16m; allow 5h for this uninterrupted process and 40m for capture/audit.
    # The independent build job stays at 120m; this run stays below the 6h limit.
    timeout-minutes: 340
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
      TRUSTED_PACKAGE_SHA: '${{ needs.build.outputs.package_sha256 }}'
      TRUSTED_SOURCE_COMMIT: '${{ needs.build.outputs.source_commit }}'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the same fixed official source runtime as the existing Host gate
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . PyYAML==6.0.3 numpy==2.3.5 uv==0.12.19 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
          bash chisel/continuous_prefill/scripts/prepare_hardfloat.sh
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: work/host_gdn_block_download
      - name: Reacquire only pinned layer0 and prefix payloads
        run: |
          python scripts/collect_qwen35_layer0_payload.py --output work/qwen35_layer0_payload
          python scripts/collect_qwen35_prefix_payload.py --output work/qwen35_prefix_payload
      - name: Fresh live full-block reference, cold token19 then carried token92 on one actual DUT
        env: {HF_HUB_OFFLINE: '1'}
        run: |
          python chisel/continuous_prefill/scripts/run_host_bf16_gdn_fresh_gate.py run --profile block --output work/host_gdn_block_pass_ci --archive work/host_gdn_block_download/host_gdn_build.tar.gz --expected-sha256 "$TRUSTED_PACKAGE_SHA" --expected-commit "$TRUSTED_SOURCE_COMMIT" --mode pass --timeout-seconds 18000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-gdn-block-pass-proof-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            work/host_gdn_block_pass_ci/compact/summary.json
            work/host_gdn_block_pass_ci/compact/source_input_hashes.json

  block-acceptance:
    needs: [build, block-canonical-native-pass]
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both exact-source full-block jobs to succeed
        env:
          NEEDS_RESULTS: '${{ toJSON(needs) }}'
        run: |
          python - <<'PY'
          import json, os
          results = {name: row['result'] for name, row in json.loads(os.environ['NEEDS_RESULTS']).items()}
          expected = {'build', 'block-canonical-native-pass'}
          if set(results) != expected or any(value != 'success' for value in results.values()):
              raise SystemExit('PENDING: canonical and native full-block acceptance did not complete successfully: ' + json.dumps(results))
          PY
      - name: Record canonical and native full-block acceptance
        run: |
          echo 'PASS_PRODUCTION_HOST_GDN_BLOCK: two continuous M1 launches, cold token19 then carried token92, seventeen commands and 216 descriptor records each on one actual HostBlockTop.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raw hidden -> InputNorm -> QKV/Z/AB -> Conv -> Prep -> FP32 recurrent -> gatedNorm -> O -> residual1 -> postNorm -> Gate/Up -> SiLU*Up -> Down -> residual2 -> dual-state fence. Both persistent state roots are published only after physical output ACKs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual useful Dense MACs: 43,057,152; independent padded oracle FMA steps: 43,515,904; physical ACK bytes: 2,388,096. One matrix engine, eight slices, one iDMA, shared scalar service.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact canonical bits are checked separately from original-native gates. Final BF16 output: maxabs <=0.05, meanabs <=0.01; hidden BF16 operators: maxabs <=0.03125, meanabs <=0.005; FP32 state: atol=rtol=1e-4. Any native FAIL fails overall CI while preserving canonical results.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fault injection, reset recovery, checkpoint restore and timing signoff remain PENDING. No tensors, weights, fixtures, NPZ or raw DDR evidence are uploaded.' >> "$GITHUB_STEP_SUMMARY"
