name: qwen35-production-Host-BF16-projections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-bf16-v.yml'
      - 'chisel/continuous_prefill/**'
      - 'chisel/p0_safety/src/main/**'
      - 'integration/gemmini/EmitHeteroBF16Fma.scala'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'rtl/matrix/**'
      - 'rtl/integration/idma*'
      - 'rtl/integration/qwen2_matrix_command_endpoint.sv'
      - 'src/heteronpu/descriptor_chain.py'
      - 'src/heteronpu/command.py'
      - 'src/heteronpu/gemmini_descriptor_v2.py'
      - 'src/heteronpu/abi_validation.py'
      - 'src/heteronpu/qk_norm256_materialization.py'
      - 'src/heteronpu/matrix_norm_rope_candidate.py'
      - 'src/heteronpu/rope_bf16_candidate.py'
      - 'src/heteronpu/qk_norm256_candidate.py'
      - 'src/heteronpu/model_geometry.py'
      - 'src/heteronpu/pinned_block_payload.py'
      - 'src/heteronpu/weight_header_contract.py'
      - 'src/heteronpu/gemmini_rocc_lowering.py'
      - 'scripts/matrix_norm_rope_reference.c'
      - 'scripts/check_git_payloads.py'
      - 'pyproject.toml'
      - 'config/upstream/qwen3_5_0p8b/**'
      - 'scripts/collect_qwen35*payload.py'
      - 'scripts/run_qwen35_bf16_audit.py'
      - 'scripts/run_qwen35_prefix_chain.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-bf16-v-${{ github.sha }}
  cancel-in-progress: false
jobs:
  fresh-official-actual-Host-V:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_JOBS: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: sbt/setup-sbt@v1
      - name: Install fixed official source runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest PyYAML==6.0.3 numpy==2.3.5 uv==0.12.19 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Prepare pinned simulator and FIRRTL compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y verilator g++ make curl
          bash chisel/continuous_prefill/scripts/prepare_host_ci_tools.sh "$GITHUB_WORKSPACE/work/host_ci_tools"
      - name: Rebuild and verify original public iDMA sources
        run: |
          python chisel/continuous_prefill/scripts/prepare_pinned_idma_sources.py --output work/host_ci_idma
          echo "IDMA_EXPORT=$GITHUB_WORKSPACE/work/host_ci_idma/idma_export" >> "$GITHUB_ENV"
      - name: Descriptor and source admission regression
        run: |
          python scripts/check_git_payloads.py
          python -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_v*.py tests/test_descriptor_chain.py tests/test_gemmini_descriptor_v2.py
          python -O -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_v*.py tests/test_descriptor_chain.py tests/test_gemmini_descriptor_v2.py
      - name: Reacquire pinned public weights
        run: |
          python scripts/collect_qwen35_layer0_payload.py --output work/qwen35_layer0_payload
          python scripts/collect_qwen35_layer3_payload.py --output work/qwen35_layer3_payload
          python scripts/collect_qwen35_prefix_payload.py --output work/qwen35_prefix_payload
      - name: Fresh prefix sources, actual Host faults, four complete V M128 cases
        env: {HF_HUB_OFFLINE: '1'}
        run: |
          python chisel/continuous_prefill/scripts/run_host_bf16_v_fresh_gate.py --output work/host_bf16_v_ci --full128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-bf16-v-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            work/host_bf16_v_ci/compact/summary.json
            work/host_bf16_v_ci/compact/source_input_hashes.json

  legacy-real2-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      source_commit: ${{ steps.package.outputs.source_commit }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    env:
      BUILD_JOBS: '1'
      BOUNDED_HIER_BUILD: '1'
      BUILD_RESERVE_BYTES: '1073741824'
      JVM_OPTS: '-Xmx3G -Xss4M -XX:ActiveProcessorCount=2'
      SBT_OPTS: '-Dsbt.supershell=false -Dsbt.task.cpus=2'
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
      SOURCE_IDENTITY_SCOPE: legacy_host_gate
      MATRIX_MACS: '4096'
      WEIGHT_READ_BEATS: '16'
      PIPELINED_OWNER: '1'
      NATIVE_BF16_WEIGHTS: '1'
      BURST_WRITE: '0'
      COMMIT_TAIL_READ: '0'
      OVERLAP_SILU: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: sbt/setup-sbt@v1
      - name: Prepare fixed public build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y verilator g++ make curl
          python -m pip install -e . pytest PyYAML==6.0.3 numpy==2.3.5 uv==0.12.19
          bash chisel/continuous_prefill/scripts/prepare_host_ci_tools.sh "$GITHUB_WORKSPACE/work/legacy_ci_tools"
          python chisel/continuous_prefill/scripts/prepare_pinned_idma_sources.py --output work/legacy_ci_idma
          echo "IDMA_EXPORT=$GITHUB_WORKSPACE/work/legacy_ci_idma/idma_export" >> "$GITHUB_ENV"
      - name: Test transfer admission and failure states
        run: |
          python -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_real2_ci.py
          python -O -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_real2_ci.py
      - name: Build original real16 two-layer Host without running it
        env: {HOST_BLOCK_BUILD_ONLY: '1'}
        run: |
          bash chisel/continuous_prefill/scripts/run_host_block_gate.sh real "$GITHUB_WORKSPACE/work/legacy_real2_build" 16 9467985920 2
      - name: Seal minimal replay package with source and file identities
        id: package
        run: |
          python chisel/continuous_prefill/scripts/real2_ci.py package --repo "$GITHUB_WORKSPACE" --build "$GITHUB_WORKSPACE/work/legacy_real2_build" --hardfloat "$HARDFLOAT_SOURCE" --output "$GITHUB_WORKSPACE/work/legacy_real2_package.tar.gz" --github-output "$GITHUB_OUTPUT"
          echo "artifact_name=legacy-real2-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: work/legacy_real2_package.tar.gz
      - name: Record build-only or failed state without numerical acceptance
        if: always()
        run: |
          python chisel/continuous_prefill/scripts/real2_ci.py summarize --evidence "$GITHUB_WORKSPACE/work/legacy_real2_build" --output "$GITHUB_WORKSPACE/work/legacy_real2_build_summary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-real2-build-summary-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            work/legacy_real2_build_summary/

  legacy-real2-continuous:
    needs: legacy-real2-build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
      TRUSTED_PACKAGE_SHA: '${{ needs.legacy-real2-build.outputs.package_sha256 }}'
      TRUSTED_SOURCE_COMMIT: '${{ needs.legacy-real2-build.outputs.source_commit }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare verifier dependencies only
        run: |
          python -m pip install -e . PyYAML==6.0.3 numpy==2.3.5
          bash chisel/continuous_prefill/scripts/prepare_hardfloat.sh
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.legacy-real2-build.outputs.artifact_name }}
          path: work/legacy_real2_download
      - name: Verify exact build-job digest before extracting executable
        run: |
          python chisel/continuous_prefill/scripts/real2_ci.py unpack --repo "$GITHUB_WORKSPACE" --archive "$GITHUB_WORKSPACE/work/legacy_real2_download/legacy_real2_package.tar.gz" --expected-sha256 "$TRUSTED_PACKAGE_SHA" --expected-commit "$TRUSTED_SOURCE_COMMIT" --output "$GITHUB_WORKSPACE/work/legacy_real2_ci"
      - name: Run all 42 commands in one process from reset and apply original oracles
        run: |
          python chisel/continuous_prefill/scripts/real2_ci.py run --repo "$GITHUB_WORKSPACE" --evidence "$GITHUB_WORKSPACE/work/legacy_real2_ci" --hardfloat "$HARDFLOAT_SOURCE" --expected-sha256 "$TRUSTED_PACKAGE_SHA" --expected-commit "$TRUSTED_SOURCE_COMMIT" --timeout-seconds 19500
      - name: Preserve terminal or incomplete state
        if: always()
        run: |
          python chisel/continuous_prefill/scripts/real2_ci.py summarize --evidence "$GITHUB_WORKSPACE/work/legacy_real2_ci" --output "$GITHUB_WORKSPACE/work/legacy_real2_ci_summary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-real2-result-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            work/legacy_real2_ci_summary/

  fresh-official-actual-Host-QKV-representative:
    # Projection-only default gate. No full128 independent-reference scope yet.
    # Each run_case remains one uninterrupted Q/K/V launch on the actual Host.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_JOBS: '1'
      BUILD_RESERVE_BYTES: '1073741824'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HARDFLOAT_SOURCE: '${{ github.workspace }}/work/upstream/hardfloat_continuous'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: sbt/setup-sbt@v1
      - name: Install fixed official source runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest PyYAML==6.0.3 numpy==2.3.5 uv==0.12.19 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Prepare existing pinned Host tools and original iDMA sources
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y verilator g++ make curl
          bash chisel/continuous_prefill/scripts/prepare_host_ci_tools.sh "$GITHUB_WORKSPACE/work/qkv_ci_tools"
          python chisel/continuous_prefill/scripts/prepare_pinned_idma_sources.py --output work/qkv_ci_idma
          echo "IDMA_EXPORT=$GITHUB_WORKSPACE/work/qkv_ci_idma/idma_export" >> "$GITHUB_ENV"
      - name: QKV descriptor, fixture, physical-output and source-admission regression
        run: |
          python scripts/check_git_payloads.py
          python -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_qkv*.py tests/test_descriptor_chain.py tests/test_gemmini_descriptor_v2.py
          python -O -m pytest -o addopts='' -q chisel/continuous_prefill/tests/test_host_bf16_qkv*.py tests/test_descriptor_chain.py tests/test_gemmini_descriptor_v2.py
      - name: Reacquire pinned public weights
        run: |
          python scripts/collect_qwen35_layer0_payload.py --output work/qwen35_layer0_payload
          python scripts/collect_qwen35_layer3_payload.py --output work/qwen35_layer3_payload
          python scripts/collect_qwen35_prefix_payload.py --output work/qwen35_prefix_payload
      - name: Fresh prefix and independent terminals, one actual Host, representative QKV plus faults
        env: {HF_HUB_OFFLINE: '1'}
        run: |
          python chisel/continuous_prefill/scripts/run_host_bf16_qkv_fresh_gate.py --output work/host_bf16_qkv_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-bf16-qkv-representative-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            work/host_bf16_qkv_ci/compact/summary.json
            work/host_bf16_qkv_ci/compact/source_input_hashes.json
