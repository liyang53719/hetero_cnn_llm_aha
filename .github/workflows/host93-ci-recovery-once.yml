name: host93-ci-recovery-once
# TEMP SOURCE: publish this exact workflow only after whole-job SOURCE review.
# A push touching only this path launches one new Host job, never a retry.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/host93-ci-recovery-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  host-recovery:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.repository == 'liyang53719/hetero_cnn_llm_aha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Establish one shared 6600 second job deadline
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B -c 'import os,time; f=open(os.environ["GITHUB_ENV"],"a"); t=time.monotonic(); f.write("HOST93_JOB_DEADLINE="+str(t+6600)+"\nHOST93_WORK_DEADLINE="+str(t+6480)+"\n"); f.close()'
      - name: Check out exact reviewed push
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - name: Bind checkout and first attempt
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = liyang53719/hetero_cnn_llm_aha
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(timeout --signal=TERM --kill-after=2s 5s git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch one fixed existing source artifact
        id: artifact
        timeout-minutes: 4
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          remaining=$(python3 -I -S -B -c 'import os,time,sys; x=min(185,int(float(os.environ["HOST93_JOB_DEADLINE"])-time.monotonic()-5)); sys.exit(1) if x<=0 else print(x)')
          timeout --signal=TERM --kill-after=5s "${remaining}s" python3 -I -S -B candidates/host93_ci_recovery/download_idma.py --out "$RUNNER_TEMP/host93-idma.zip"
      - name: One bounded tool micro Host reset and launch sequence
        id: actual
        timeout-minutes: 111
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          remaining=$(python3 -I -S -B -c 'import os,time,sys; x=int(float(os.environ["HOST93_WORK_DEADLINE"])-time.monotonic()-10); sys.exit(1) if x<=0 else print(x)')
          timeout --signal=TERM --kill-after=10s "${remaining}s" python3 -I -S -B candidates/host93_ci_recovery/run.py --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/host93-ci-private" --idma-archive "$RUNNER_TEMP/host93-idma.zip" --job-deadline "$HOST93_WORK_DEADLINE" --execute
      - name: Validate only sanitized evidence
        id: safe
        if: always() && (steps.actual.outcome == 'success' || steps.actual.outcome == 'failure')
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(python3 -I -S -B -c 'import os,time,sys; x=min(30,int(float(os.environ["HOST93_JOB_DEADLINE"])-time.monotonic()-60)); sys.exit(1) if x<=0 else print(x)')
          timeout --signal=TERM --kill-after=2s "${remaining}s" python3 -I -S -B candidates/host93_ci_recovery/run.py --verify-evidence --out "$RUNNER_TEMP/host93-ci-private"
      - name: Upload only three validated safe JSON files
        if: always() && steps.safe.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host93-ci-safe-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            ${{ runner.temp }}/host93-ci-private/evidence/summary.json
            ${{ runner.temp }}/host93-ci-private/evidence/source_hashes.json
            ${{ runner.temp }}/host93-ci-private/evidence/stage_exits.json
