name: import-production-pipeline-20260908
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-production-pipeline-20260908.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 2
      - name: Verify exact snapshot and commit source files atomically
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,uuid
          from pathlib import Path
          root=Path.cwd(); folder=root/'development_snapshots/pipeline_20260908'
          encoded=''.join((folder/f'part{i:02d}.b64').read_text().strip() for i in range(3))
          # Correct transport-only transcription errors, then require the original
          # compressed SHA and EVERY destination source hash; never relax hashes.
          corrections=[('F+KLadz/GhKa37','F+KLadz/GKa37'),('7hJpYPPmMHz','7hJpYPmMHz'),('R523Ja2/J62zJ627J62b627J62/JG2z','R523Ja2/J62zJ627J623J62/JG2z')]
          applied=[]
          for old,new in corrections:
              if old in encoded:
                  if encoded.count(old)!=1:raise SystemExit('AMBIGUOUS_TRANSPORT_REPAIR')
                  encoded=encoded.replace(old,new);applied.append([old,new])
          expected='b4d1233b83b993e059cb07d75ae1fcabbbeefe6654a604d3746d4332f7888aa7'
          raw=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(raw).hexdigest()!=expected:
              print('ENCODED_LENGTH',len(encoded),'SHA256',hashlib.sha256(raw).hexdigest())
              print('BLOCK_HASHES',json.dumps([hashlib.sha256(encoded[i:i+1000].encode()).hexdigest() for i in range(0,len(encoded),1000)]))
              raise SystemExit('SNAPSHOT_CHECKSUM_MISMATCH')
          data=json.loads(gzip.decompress(raw));assert data['schema']==2
          files=data['files'];paths=[f['path'] for f in files]
          if len(paths)!=14 or len(set(paths))!=len(paths):raise SystemExit('INVALID_FILE_SET')
          for name in paths:
              p=Path(name)
              if p.is_absolute() or '..' in p.parts or not name.startswith('chisel/continuous_prefill/') or p.suffix not in ('.scala','.cpp','.py','.sh'):raise SystemExit('UNAPPROVED_SOURCE_PATH')
          def git(*args,env=None,content=None):return subprocess.check_output(['git',*args],env=env,input=content)
          for attempt in range(3):
              subprocess.run(['git','fetch','--no-tags','origin','main'],check=True)
              parent=git('rev-parse','origin/main').decode().strip()
              state=[]
              for f in files:
                  p=subprocess.run(['git','show',parent+':'+f['path']],capture_output=True)
                  state.append(hashlib.sha256(p.stdout).hexdigest() if p.returncode==0 else None)
              if state==[f['sha256'] for f in files]:
                  print('ALREADY_IMPORTED',parent);break
              if state!=[f['base_sha256'] for f in files]:raise SystemExit('BASE_SOURCE_CHANGED')
              env=dict(os.environ,GIT_INDEX_FILE=str(root/('pipeline_import_index_'+uuid.uuid4().hex)),GIT_AUTHOR_NAME='heteronpu-pipeline',GIT_AUTHOR_EMAIL='heteronpu-pipeline@users.noreply.github.com',GIT_COMMITTER_NAME='heteronpu-pipeline',GIT_COMMITTER_EMAIL='heteronpu-pipeline@users.noreply.github.com')
              git('read-tree',parent,env=env)
              git('apply','--cached','--whitespace=nowarn','-',env=env,content=data['patch'].encode())
              for name,text in data['new_files'].items():
                  if name not in paths:raise SystemExit('UNLISTED_NEW_FILE')
                  blob=git('hash-object','-w','--stdin',content=text.encode()).decode().strip()
                  git('update-index','--add','--cacheinfo','100644',blob,name,env=env)
              changed=git('diff','--cached','--name-only',parent,env=env).decode().splitlines()
              if sorted(changed)!=sorted(paths):raise SystemExit('CHANGED_PATHS_MISMATCH')
              for f in files:
                  if hashlib.sha256(git('show',':'+f['path'],env=env)).hexdigest()!=f['sha256']:raise SystemExit('SOURCE_BYTES_MISMATCH')
              tree=git('write-tree',env=env).decode().strip()
              commit=git('commit-tree',tree,'-p',parent,'-m','feat(chisel): add opt-in streamed Dense, five-context Matrix and vector SiLU [skip ci]',env=env).decode().strip()
              if subprocess.run(['git','push','origin',commit+':main']).returncode==0:
                  subprocess.run(['git','fetch','--no-tags','origin','main'],check=True)
                  for f in files:
                      if hashlib.sha256(git('show','origin/main:'+f['path'])).hexdigest()!=f['sha256']:raise SystemExit('REMOTE_SOURCE_MISMATCH')
                  report={'source_commit':commit,'parent':parent,'files':files,'snapshot_sha256':expected,'transport_corrections':applied,'remote_readback':True,'scope':'Opt-in development code; component tests run in sandbox. Full integrated numerical gate still required. No existing or generated RTL was edited.'}
                  Path('pipeline_import_result.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2));break
          else:raise SystemExit('FAST_FORWARD_IMPORT_FAILED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-pipeline-source-import-${{ github.sha }}
          path: pipeline_import_result.json
          if-no-files-found: warn
          retention-days: 90
