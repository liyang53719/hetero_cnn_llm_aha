name: import-recovered-operator-primitives

on:
  push:
    branches: [main]
    paths:
      - '.recovery/operator_primitives_800mhz/READY'

permissions:
  contents: write

concurrency:
  group: import-recovered-operator-primitives-main
  cancel-in-progress: false

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify recovered Git bundle
        shell: bash
        run: |
          set -euo pipefail
          stage='.recovery/operator_primitives_800mhz'
          cat "$stage"/parts/part-*.b64 | tr -d '\n\r' | base64 -d > /tmp/operator_primitives_800mhz.bundle
          echo 'd51a796a24d60ad3043b2351abc2c38e77528d1b35bced369ebf36f82aae878b  /tmp/operator_primitives_800mhz.bundle' | sha256sum -c -
          git bundle verify /tmp/operator_primitives_800mhz.bundle
          git fetch /tmp/operator_primitives_800mhz.bundle \
            'refs/heads/main:refs/remotes/recovered/operator-primitives-800mhz'
          test "$(git rev-parse refs/remotes/recovered/operator-primitives-800mhz)" = \
            '178bd9619abb373a54b41747553b8ac4384a2df6'

      - name: Extract only the recovered supplementary package
        shell: bash
        run: |
          set -euo pipefail
          recovered='178bd9619abb373a54b41747553b8ac4384a2df6'
          git archive "$recovered" \
            integration/gemmini/operator_primitives \
            configs/global_clock_800mhz.yaml \
            dc/operator_primitives_800mhz.tcl | tar -x
          test "$(git ls-tree -r --name-only "$recovered" -- \
            integration/gemmini/operator_primitives \
            configs/global_clock_800mhz.yaml \
            dc/operator_primitives_800mhz.tcl | wc -l)" -eq 31
          test -f integration/gemmini/operator_primitives/src/main/scala/gemmini/HeteroModelOperatorSequencer.scala
          test -f integration/gemmini/operator_primitives/terminal_primitive_bindings_800mhz.yaml
          test -f configs/global_clock_800mhz.yaml
          test -f dc/operator_primitives_800mhz.tcl

      - name: Run recovered source and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pytest
          chmod +x integration/gemmini/operator_primitives/scripts/*.sh
          integration/gemmini/operator_primitives/scripts/run_sandbox_tests.sh
          python3 -m pytest -q integration/gemmini/operator_primitives/tests
          bash -n integration/gemmini/operator_primitives/scripts/*.sh
          grep -q 'target_hz: 800000000' configs/global_clock_800mhz.yaml
          grep -q 'set HETERO_CLOCK_PERIOD_NS 1.25' dc/operator_primitives_800mhz.tcl

      - name: Commit package to main and remove one-time staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery/operator_primitives_800mhz
          rm -f .github/workflows/import-recovered-operator-primitives.yml
          git config user.name 'heteronpu-recovery-ci'
          git config user.email 'noreply@github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chisel: import recovered 800MHz terminal primitive backends [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$local_sha" = "$remote_sha"
          echo "IMPORTED_COMMIT=$local_sha" >> "$GITHUB_ENV"

      - name: Record final state
        run: |
          echo "Recovered operator primitive package committed at ${IMPORTED_COMMIT}"
