name: qwen35-actual-Matrix16x32-token-batching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-norm-rope-tile16-candidate.yml'
      - 'rtl/integration/qwen2_projection*'
      - 'rtl/integration/qwen2_shared_l2_matrix_tile16_payload.sv'
      - 'rtl/integration/qwen2_matrix_command_endpoint.sv'
      - 'rtl/integration/*rope*'
      - 'rtl/fabric/shared_l2_fabric.sv'
      - 'rtl/matrix/**'
      - 'rtl/sfu/fp32_*'
      - 'rtl/sfu/qk_norm256_bf16_candidate.sv'
      - 'tb/tb_qwen35_matrix_norm_rope_tile16.sv'
      - 'tb/tb_qwen2_matrix_tile16_nonfinite.sv'
      - 'scripts/*matrix_norm_rope*'
      - 'scripts/run_matrix_tile16_nonfinite.py'
      - 'scripts/qk_norm256_reference.c'
      - 'scripts/rope_bf16_candidate_reference.c'
      - 'scripts/rebuild_qk_norm256_corpora.py'
      - 'scripts/run_qwen35_bf16_audit.py'
      - 'scripts/run_qwen35_prefix_chain.py'
      - 'scripts/collect_qwen35*payload.py'
      - 'scripts/check_git_payloads.py'
      - 'src/heteronpu/matrix_norm_rope*'
      - 'src/heteronpu/qk_norm256*'
      - 'src/heteronpu/rope_bf16_candidate.py'
      - 'src/heteronpu/qwen35*reference.py'
      - 'src/heteronpu/model_geometry.py'
      - 'src/heteronpu/qwen35_dense_contract.py'
      - 'src/heteronpu/qwen_family_contracts.py'
      - 'src/heteronpu/weight_header_contract.py'
      - 'src/heteronpu/pinned*payload.py'
      - 'config/upstream/qwen3_5_0p8b/**'
      - 'config/upstream/weight_headers/qwen3_5_0p8b/**'
      - 'tests/test_matrix_norm_rope*'
      - 'tests/test_matrix_tile16_nonfinite.py'
      - 'chisel/matrix_norm_rope_hardware/**'
      - 'chisel/rope_hardware_oracle/maven-lock.json'
      - 'integration/gemmini/EmitHeteroBF16Fma.scala'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'integration/gemmini/EmitHeteroFP32Pipelines.scala'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-sixteen-row-raw-producer-default-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest numpy==2.3.5 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Reject Git payloads and acquire transient pinned source ranges
        run: |
          python scripts/check_git_payloads.py
          python scripts/collect_qwen35_layer0_payload.py --output work/qwen35_layer0_payload
          python scripts/collect_qwen35_layer3_payload.py --output work/qwen35_layer3_payload
          python scripts/collect_qwen35_prefix_payload.py --output work/qwen35_prefix_payload
      - name: Normal and optimized source reference and protocol tests
        run: |
          python -m pytest -o addopts='' -q tests/test_matrix_norm_rope*.py tests/test_matrix_tile16_nonfinite.py
          python -O -m pytest -o addopts='' -q tests/test_matrix_norm_rope*.py tests/test_matrix_tile16_nonfinite.py
      - name: Fresh official sources then actual Matrix512 and real SharedL2
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python scripts/run_matrix_norm_rope_tile16_candidate.py --output work/matrix_norm_rope_tile16_result --jobs 2
      - name: Attribute complete command cycles without overlapping the denominator
        run: |
          python scripts/analyze_matrix_norm_rope_tile16_phases.py --runner-summary work/matrix_norm_rope_tile16_result/summary.json --trace-directory work/matrix_norm_rope_tile16_result --output work/matrix_norm_rope_tile16_result/phases.json
      - name: Preserve only hashes and compact result summary
        if: always()
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          source=Path('work/matrix_norm_rope_tile16_result/summary.json')
          if not source.exists():
              raise SystemExit('No terminal source-bound RTL result; gate remains unverified')
          r=json.loads(source.read_text())
          summary={k:v for k,v in r.items() if k!='fixture_summary'}
          f=r['fixture_summary']
          summary['fixture_totals']=f['totals']
          summary['native_failed_comparisons']=f['native_failed_comparisons']
          summary['native_failed_command_comparisons']=f.get('native_failed_command_comparisons',[])
          summary['supplemental_native_failed_comparisons']=f.get('supplemental_native_failed_comparisons',[])
          phase_path=source.parent/'phases.json'
          summary['cycle_phase_analysis']=json.loads(phase_path.read_text()) if phase_path.exists() else {'final_runner_bound': False, 'status': 'NOT_EXECUTED'}
          summary['tested_commit']=os.environ['GITHUB_SHA']
          Path('work/tile16_ci_summary').mkdir(parents=True,exist_ok=True)
          Path('work/tile16_ci_summary/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-matrix-tile16-${{ github.sha }}
          path: work/tile16_ci_summary/summary.json
          if-no-files-found: error
