name: matrix4096-real2-20260907
on:
  push:
    branches: [main]
    paths: ['.github/workflows/matrix4096-real2-20260907.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: matrix4096-real2-20260907
  cancel-in-progress: false
jobs:
  real2:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      JVM_OPTS: -Xmx3G -Xss4M -XX:ActiveProcessorCount=3
      BUILD_JOBS: '2'
      MATRIX_MACS: '4096'
      MAKEFLAGS: 'VK_PCH_I_FAST= VK_PCH_I_SLOW= OPT_FAST=-O3'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Install public tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y verilator g++
          python3 -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: pinned-idma-source-dba1cac9576026fd987775e6e0db5aec96bb9b38
          run-id: 34017420593
          github-token: ${{ github.token }}
          path: upstream_idma_artifact
      - name: Freeze sources and prepare pinned arithmetic
        run: |
          set -euo pipefail
          mkdir -p work/matrix4096_upstream
          (cd upstream_idma_artifact;sha256sum -c pinned_idma_sources.sha256)
          tar -xzf upstream_idma_artifact/pinned_idma_sources.tar.gz -C work/matrix4096_upstream
          bash chisel/continuous_prefill/scripts/prepare_hardfloat.sh > matrix4096_prepare.log 2>&1
          git rev-parse HEAD > matrix4096_tested_source.txt
          git archive HEAD chisel/continuous_prefill chisel/p0_safety integration/gemmini rtl/matrix rtl/integration src/heteronpu config configs .github/workflows | gzip > matrix4096_source.tar.gz
          sha256sum matrix4096_source.tar.gz > matrix4096_source.sha256
      - name: Actual Chisel join protocol and metric rejection tests
        run: |
          set -euo pipefail
          (cd chisel/continuous_prefill;sbt -batch 'testOnly heteronpu.continuous.MatrixSliceJoinSpec') > matrix4096_chisel_tests.log 2>&1
          python3 chisel/continuous_prefill/tests/test_matrix_topology.py > matrix4096_topology_tests.log 2>&1
          python3 chisel/continuous_prefill/tests/test_matrix4096_metrics.py > matrix4096_metric_tests.log 2>&1
          python3 -O chisel/continuous_prefill/tests/test_matrix4096_metrics.py > matrix4096_metric_optimized_tests.log 2>&1
      - name: Full real16 two-layer numerical execution and actual-output comparison
        run: |
          set -euo pipefail
          export IDMA_EXPORT="$PWD/work/matrix4096_upstream/idma_export"
          bash chisel/continuous_prefill/scripts/run_real_two_layer_gate.sh "$PWD/work/matrix4096_real2"
          python3 chisel/continuous_prefill/scripts/compare_matrix4096_real2.py \
            --current "$PWD/work/matrix4096_real2" \
            --baseline "$PWD/reports/execution/REAL16_TWO_LAYER_9f06249ca11f/numerical" \
            --output "$PWD/work/matrix4096_real2/PERFORMANCE_COMPARISON.json" > matrix4096_comparison.log
          git diff --exit-code
      - name: Preserve exact successful proof with an independent index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess,uuid
          from pathlib import Path
          root=Path('work/matrix4096_real2');source=os.environ['GITHUB_SHA']
          r=json.loads((root/'PERFORMANCE_COMPARISON.json').read_text())
          if r['status']!='PASS_MATRIX4096_REAL16_TWO_LAYER_EXACT_COMPARISON' or r['tested_source']!=source:raise SystemExit('UNSEALED_RESULT')
          skip={'obj','classes','testclasses','test_run_dir','verilator-runtime','offline-tools-runtime','__pycache__'}
          selected={}
          for p in sorted(root.rglob('*')):
              rel=p.relative_to(root)
              if p.is_file() and not p.is_symlink() and not any(x in skip for x in rel.parts) and p.suffix in {'.json','.log','.gz','.f32le','.bin','.h','.sv','.txt','.exit','.sha256'}:
                  selected['numerical/'+str(rel)]=p.read_bytes()
          for name in ['matrix4096_chisel_tests.log','matrix4096_topology_tests.log','matrix4096_metric_tests.log','matrix4096_metric_optimized_tests.log','matrix4096_tested_source.txt']:
              selected[name]=Path(name).read_bytes()
          selected['PUBLISHED_SHA256.json']=(json.dumps({p:hashlib.sha256(b).hexdigest() for p,b in selected.items()},indent=2)+'\n').encode()
          identities=json.loads((root/'sources.sha256.json').read_text());prefix='reports/execution/MATRIX4096_REAL2_'+source[:12]
          def git(*args,env=None):return subprocess.check_output(['git',*args],env=env)
          blobs={p:subprocess.check_output(['git','hash-object','-w','--stdin'],input=b).decode().strip() for p,b in selected.items()}
          for attempt in range(3):
              subprocess.run(['git','fetch','--no-tags','origin','main'],check=True);parent=git('rev-parse','origin/main').decode().strip()
              for p,d in identities.items():
                  if hashlib.sha256(git('show',parent+':'+p)).hexdigest()!=d:raise SystemExit('TESTED_SOURCE_CHANGED:'+p)
              env=dict(os.environ,GIT_INDEX_FILE=str(Path.cwd()/('matrix4096_index_'+uuid.uuid4().hex)),GIT_AUTHOR_NAME='heteronpu-verified-matrix4096',GIT_AUTHOR_EMAIL='heteronpu-verified@users.noreply.github.com',GIT_COMMITTER_NAME='heteronpu-verified-matrix4096',GIT_COMMITTER_EMAIL='heteronpu-verified@users.noreply.github.com')
              git('read-tree',parent,env=env)
              for p,b in blobs.items():
                  path=prefix+'/'+p;old=subprocess.run(['git','show',parent+':'+path],capture_output=True)
                  if old.returncode==0 and old.stdout!=selected[p]:raise SystemExit('REFUSE_OVERWRITE')
                  git('update-index','--add','--cacheinfo','100644',b,path,env=env)
                  if git('show',':'+path,env=env)!=selected[p]:raise SystemExit('INDEX_BYTE_MISMATCH')
              tree=git('write-tree',env=env).decode().strip()
              commit=git('commit-tree',tree,'-p',parent,'-m','test: preserve verified 4096-MAC real16 two-layer numeric and performance proof [skip ci]',env=env).decode().strip()
              if subprocess.run(['git','push','origin',commit+':main']).returncode==0:
                  subprocess.run(['git','fetch','--no-tags','origin','main'],check=True)
                  subprocess.run(['git','merge-base','--is-ancestor',commit,'origin/main'],check=True)
                  for p,b in selected.items():
                      if git('show','origin/main:'+prefix+'/'+p)!=b:raise SystemExit('REMOTE_BYTE_MISMATCH')
                  Path('matrix4096_publication.json').write_text(json.dumps({'commit':commit,'source':source,'path':prefix,'files':len(selected),'remote_bytes_verified':True},indent=2)+'\n')
                  break
          else:raise SystemExit('PUBLICATION_FAILED_NO_FORCE_PUSH')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix4096-real2-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            matrix4096_*.log
            matrix4096_*.txt
            matrix4096_*.json
            matrix4096_source.tar.gz
            matrix4096_source.sha256
            work/matrix4096_real2/**
            !work/**/obj/**
            !work/**/classes/**
            !work/**/testclasses/**
            !work/**/test_run_dir/**
            !work/**/verilator-runtime/**
            !work/**/offline-tools-runtime/**
            !work/**/__pycache__/**
