name: portable-same-host-m128-launch-r1
# SOURCE-ONLY PROPOSAL, NOT APPROVED FOR EXECUTION.
# Publishing this exact workflow path to main is a launch action and needs approval.
# One owned parent: fresh M16 setup 900s + prepare 120s + full outer 930s = 1950s.
# Strict current-job M16 prerequisite, then fresh M128 producer + verifier 300s,
# M128 prepare 120s, full outer 2430s (numerical 2400s), M16 transition 30s.
# Stage envelopes total 4830s; 80s shared reserve + TERM4910/KILL+10 = 4920s.
# Nested M16 failure observations remain in sanitized m16_attempt_summary.json.
# Successor records path-free replay identities only after qualified numerical postflight.
# Cold shape checks authorize no launch, package installation, numerical work or compilation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-same-host-m128-launch-r1.yml'
permissions:
  contents: read
concurrency:
  group: portable-same-host-m128-launch-r1-${{ github.sha }}
  cancel-in-progress: false
jobs:
  fresh-m16-then-m128:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.repository == 'liyang53719/hetero_cnn_llm_aha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      GIT_NO_LAZY_FETCH: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the first push attempt to checkout HEAD
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = liyang53719/hetero_cnn_llm_aha
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(timeout --signal=TERM --kill-after=2s 5s git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD)" = "$GITHUB_SHA"
      - name: Select the exact hosted base interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 3
        with:
          python-version: '3.12.15'
          architecture: x64
          check-latest: false
      - name: One owned parent with fresh full M16 then fresh full M128
        timeout-minutes: 84
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=10s 4910s python -I -B candidates/qwen2_resident_matrix/portable_same_host_m128_launch/run.py --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/portable-same-host-m128-r1-private"
      - name: Preserve only exact sanitized combined evidence
        if: always() && github.run_attempt == 1
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-same-host-m128-r1-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/summary.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/source_hashes.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/m16_attempt_summary.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/full_m16_summary.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/producer_summary.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/full_m128_summary.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/stage_exits.json
            ${{ runner.temp }}/portable-same-host-m128-r1-private/evidence/replay_identity.json
