name: portable-same-host-m16-launch-r1
# Launch revision 2: include the reviewed producer gate in the published source closure.
# SOURCE PROPOSAL ONLY. Publishing this exact path to main is a launch action.
# The combined source closure, caller, budgets and safe evidence need review first.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-same-host-m16-launch-r1.yml'
permissions:
  contents: read
concurrency:
  group: portable-same-host-m16-launch-r1-${{ github.sha }}
  cancel-in-progress: false
jobs:
  fresh-producer-then-m16:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.repository == 'liyang53719/hetero_cnn_llm_aha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      GIT_NO_LAZY_FETCH: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the first push attempt to checkout HEAD
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = liyang53719/hetero_cnn_llm_aha
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(timeout --signal=TERM --kill-after=2s 5s git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD)" = "$GITHUB_SHA"
      - name: Select the exact hosted base interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 3
        with:
          python-version: '3.12.15'
          architecture: x64
          check-latest: false
      - name: One fresh producer qualification followed by same-host full M16
        timeout-minutes: 33
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=10s 1940s python -I -B candidates/qwen2_resident_matrix/portable_same_host_m16_launch/run.py --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/portable-same-host-m16-r1-private"
      - name: Preserve only exact sanitized combined evidence
        if: always() && github.run_attempt == 1
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-same-host-m16-r1-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            ${{ runner.temp }}/portable-same-host-m16-r1-private/evidence/summary.json
            ${{ runner.temp }}/portable-same-host-m16-r1-private/evidence/source_hashes.json
            ${{ runner.temp }}/portable-same-host-m16-r1-private/evidence/producer_summary.json
            ${{ runner.temp }}/portable-same-host-m16-r1-private/evidence/full_m16_summary.json
            ${{ runner.temp }}/portable-same-host-m16-r1-private/evidence/stage_exits.json
