name: qwen35-experimental-QK-Norm256-actual-RTL-component
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qk-norm256-candidate.yml'
      - 'rtl/sfu/fp32_rmsnorm256_chunked.sv'
      - 'rtl/sfu/qk_norm256_bf16_candidate.sv'
      - 'rtl/sfu/fp32_reduce16.sv'
      - 'rtl/sfu/fp32_rsqrt*'
      - 'rtl/sfu/fp32_to_bf16_rne_candidate.sv'
      - 'tb/tb_qk_norm256*'
      - 'scripts/run_qk_norm256_candidate.py'
      - 'scripts/qk_norm256_reference.c'
      - 'src/heteronpu/qk_norm256_candidate.py'
      - 'src/heteronpu/qk_norm256_materialization.py'
      - 'scripts/rebuild_qk_norm256_corpora.py'
      - 'scripts/materialize_rope_rounding_corpora.py'
      - 'scripts/check_git_payloads.py'
      - 'scripts/run_qwen35_bf16_audit.py'
      - 'scripts/run_qwen35_prefix_chain.py'
      - 'scripts/collect_qwen35*payload.py'
      - 'src/heteronpu/qwen35*reference.py'
      - 'src/heteronpu/model_geometry.py'
      - 'src/heteronpu/qwen35_dense_contract.py'
      - 'src/heteronpu/qwen_family_contracts.py'
      - 'scripts/review_qk_norm256_candidate.sh'
      - 'tb/qk_norm256_review/**'
      - 'src/heteronpu/weight_header_contract.py'
      - 'config/upstream/qwen3_5_0p8b/**'
      - 'config/upstream/weight_headers/qwen3_5_0p8b/**'
      - 'src/heteronpu/pinned*payload.py'
      - 'src/heteronpu/rope_bf16_candidate.py'
      - 'tests/test_qk_norm256*'
      - 'tests/fixtures/qk_norm256*/**'
      - 'config/upstream/qwen3_5_0p8b/qk_norm256_candidate_contract.json'
      - 'chisel/rope_hardware_oracle/**'
      - 'scripts/generate_rope_hardware_primitives.sh'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'integration/gemmini/EmitHeteroFP32Pipelines.scala'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qk-head-and-packed-gate-not-full-tensor-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest numpy==2.3.5 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Materialize transient inputs and reject tracked payloads
        run: |
          python scripts/check_git_payloads.py
          python scripts/materialize_rope_rounding_corpora.py
          python scripts/collect_qwen35_layer0_payload.py --output work/qwen35_layer0_payload
          python scripts/collect_qwen35_layer3_payload.py --output work/qwen35_layer3_payload
          python scripts/collect_qwen35_prefix_payload.py --output work/qwen35_prefix_payload
      - name: Normal and optimized source, arithmetic, and fail-closed gates
        run: |
          python -m pytest -o addopts='' -q tests/test_qk_norm256*.py tests/test_rope_bf16_candidate*.py tests/test_rope_bf16_l2_candidate.py tests/test_rope_rounding_ablation.py tests/test_rope_hardware_oracle.py
          python -O -m pytest -o addopts='' -q tests/test_qk_norm256*.py tests/test_rope_bf16_candidate*.py tests/test_rope_bf16_l2_candidate.py tests/test_rope_rounding_ablation.py tests/test_rope_hardware_oracle.py
      - name: Fresh official native data, clean HardFloat, candidate and legacy RTL
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python scripts/run_qk_norm256_candidate.py --output work/qk_norm256_candidate_result
          bash scripts/review_qk_norm256_candidate.sh work/qk_norm256_independent_review
          python - <<'PY'
          import json,os
          r=json.load(open('work/qk_norm256_candidate_result/summary.json'))
          if r['status'] != 'PASS_EXPERIMENTAL_QK_NORM256_BF16_COMPONENT_AND_LAYOUT' or r['real_heads'] != 5120:
              raise SystemExit('incomplete candidate component gate')
          if any(r[k] for k in ('production_policy_changed','Matrix_producer_integrated','SharedL2_integrated','RoPE_chain_integrated','whole_tensor_owner_integrated','Command128_integrated','PPA_measured','mac_utilization_measured','U01_complete')):
              raise SystemExit('component scope inflated')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Opt-in head256 Norm with actual FP32 gamma=1+weight and raw Q gate preservation.\n\n')
              f.write('5120 freshly collected same-input native heads across baseline/AVX2; actual RTL and independent integer/C nodes and flags.\n\n')
              f.write(f"Native differences: {r['source_native_comparison']['different_values']}; original max/mean thresholds unchanged.\n\n")
              f.write('Production, Matrix producer, memory, RoPE composition, full tensor owner, complete blocks and MAC90% remain OPEN.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-qk-norm256-${{ github.sha }}
          path: work/qk_norm256_candidate_result/summary.json
          retention-days: 30
          if-no-files-found: error
