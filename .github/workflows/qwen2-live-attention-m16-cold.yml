                               'model_executed', 'rtl_executed', 'outputs_written'):
                      require(result.get(flag) is False, 'unsafe reference default flag: ' + flag)
                  for key, value in (('pinned_source_files', 21), ('official_ast_nodes', 27), ('raw_tensors', 8),
                                     ('input_roles', 9), ('reference_nodes', 18), ('payload_bytes', 7085056)):
                      require(type(result.get(key)) is int and result[key] == value, 'reference source scope: ' + key)
              else:
                  require(type(result.get('rows')) is int and result['rows'] == 16, 'default M16 shape changed')
                  for flag in ('input_loading', 'build', 'rtl', 'fullblock'):
                      require(result.get(flag) is False, 'unsafe model default flag: ' + flag)
                  require(result.get('actual_execution_authorized') is model_pins.get('actual_execution_authorized'),
                          'default authorization metadata drift')
              source_check()
              require(not any(TMP.iterdir()), 'default wrote temporary files')
              require(not any(n.split('.')[0] in RUNTIME_FORBIDDEN for n in sys.modules), 'forbidden runtime imported')
              print(captured.getvalue(), end='')
          else:
              prefix = (REF if PACKAGE == 'reference' else MODEL).replace('/', '.') + '.'
              modules = [prefix + n for n in (('tests.test_recipe',) if PACKAGE == 'reference'
                                              else ('test_gate', 'test_budget', 'test_failure_telemetry'))]
              suite = unittest.defaultTestLoader.loadTestsFromNames(modules)

              def test_ids(node):
                  if isinstance(node, unittest.TestSuite):
                      return [name for child in node for name in test_ids(child)]
                  return [node.id().removeprefix(prefix).removeprefix('tests.')]

              ids = test_ids(suite)
              expected = set(EXPECTED_TESTS[PACKAGE])
              require(len(ids) == len(expected) and len(set(ids)) == len(ids) and set(ids) == expected,
                      'missing, duplicate, or unexpected cold tests: ' + repr(ids))
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              require(result.testsRun == len(expected) and result.wasSuccessful()
                      and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses,
                      'expected exact passing cold tests with zero skips or expected failures')
              source_check()
              require(not any(TMP.iterdir()), 'cold tests left temporary files behind')
              require(not any(n.split('.')[0] in RUNTIME_FORBIDDEN for n in sys.modules), 'forbidden runtime imported')
              print('PASS: package=' + PACKAGE + '; exactly ' + str(len(expected)) + ' cold tests; zero skips; mode='
                    + MODE + '; CPython=' + sys.version.split()[0] + '; -B=1; -S=1; optimize=' + str(sys.flags.optimize)
                    + '; source_files=' + str(SOURCE_COUNT) + '; source_sha256=' + SOURCE_SHA
                    + '; actual_input_reads=0; numeric_execution=false; writes=designated_tmp_only')
          PY_COLD
          python -B -S "$evidence/check_cold.py" reference default 2>&1 | tee "$evidence/reference-default.json"
          python -B -S "$evidence/check_cold.py" model default 2>&1 | tee "$evidence/model-default.json"
          python -B -S "$evidence/check_cold.py" reference normal 2>&1 | tee "$evidence/reference-normal.log"
          python -B -S -O "$evidence/check_cold.py" reference optimized 2>&1 | tee "$evidence/reference-optimized.log"
          python -B -S "$evidence/check_cold.py" model normal 2>&1 | tee "$evidence/model-normal.log"
          python -B -S -O "$evidence/check_cold.py" model optimized 2>&1 | tee "$evidence/model-optimized.log"
      - name: Preserve only exact-head cold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2-live-attention-m16-cold-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/head.txt
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/tool.json
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/reference-default.json
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/model-default.json
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/reference-normal.log
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/reference-optimized.log
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/model-normal.log
            work/qwen2_attention_m16_cold_ci_20261014/ci-cold/model-optimized.log
