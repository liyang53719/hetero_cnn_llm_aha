              declared = {str(p.relative_to(ROOT)) for name in (REF, MODEL)
                          for p in (ROOT / name).rglob('*') if p.is_file() or p.is_symlink()}
              require(declared == set(PACKAGE_FILES), 'unexpected or missing M16 package file')
              old_dir = ROOT / 'candidates/qwen2_live_attention_model_m128'
              old = dict(json.loads((old_dir / 'pins.json').read_text())['dependency_sha256'])
