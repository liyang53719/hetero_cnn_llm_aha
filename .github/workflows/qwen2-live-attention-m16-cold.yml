          require(len(model_pins['dependency_sha256']) == 177, 'expected 177 pinned dependencies')
          SOURCES = {ROOT / name for name in model_pins['dependency_sha256']} | {ROOT / name for name in PACKAGE_FILES}
          require(len(SOURCES) == SOURCE_COUNT, 'source closure cardinality changed')


          def source_check():
              actual = {}
              for path in sorted(SOURCES):
                  require(path.is_file() and not path.is_symlink() and path.resolve() == path
                          and path.is_relative_to(ROOT), 'aliased or missing source: ' + str(path))
                  actual[str(path.relative_to(ROOT))] = sha(path.read_bytes())
              require(sha(json.dumps(actual, sort_keys=True).encode()) == SOURCE_SHA, 'frozen M16 source closure drift')
              for name, digest in model_pins['dependency_sha256'].items():
