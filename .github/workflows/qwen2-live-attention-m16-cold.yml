                  return Path(os.readlink('/proc/self/fd/' + str(value))).resolve()
              require(isinstance(value, (str, bytes, os.PathLike)), 'unexpected filesystem path')
              path = Path(os.fsdecode(value))
              if not path.is_absolute():
                  base = ROOT if dir_fd in (None, -1) else event_path(dir_fd)
                  path = base / path
              return Path(os.path.abspath(path))


