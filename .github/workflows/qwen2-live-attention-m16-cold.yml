          }
          OLD_SHA = '52d0d8f4802c06738a1678145b02d26e1c29663ffd7761590b27da297a650fb3'
          FORBIDDEN = frozenset(('numpy', 'torch', 'transformers', 'yaml', 'ctypes', 'urllib', 'requests', 'pip'))
