permissions:
  contents: read
concurrency:
  group: qwen2-live-qkv-m128-cold-${{ github.sha }}
  cancel-in-progress: false
jobs:
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library defaults and cold gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/qwen2_live_qkv_numeric_m128_20261014/ci-cold
          git rev-parse HEAD | tee work/qwen2_live_qkv_numeric_m128_20261014/ci-cold/head.txt
          python -B -S candidates/qwen2_live_qkv_inputs_m128/recipe.py 2>&1 | tee work/qwen2_live_qkv_numeric_m128_20261014/ci-cold/input-default.json
