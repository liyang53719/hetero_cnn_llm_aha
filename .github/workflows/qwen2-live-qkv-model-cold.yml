permissions:
  contents: read
concurrency:
  group: qwen2-live-qkv-model-cold-${{ github.sha }}
  cancel-in-progress: false
jobs:
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: historical
    steps:
      - name: Historical frozen source checkout
        uses: actions/checkout@v4
        with:
          ref: 55199873c0d5378c53538cc4273b53a3a012915d
          path: historical
          persist-credentials: false
      - name: Current event source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library default and cold gates
        shell: bash
        run: |
