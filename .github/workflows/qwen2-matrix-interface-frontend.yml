name: qwen2-matrix-interface-frontend

# Applies a source candidate in isolation. Chisel frontend only: no firtool,
# Verilator, checkpoint download, retained arithmetic or full-block RTL.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen2-matrix-interface-frontend.yml'
      - 'candidates/qwen2_resident_matrix/**'
      - 'scripts/check_matrix_interface_candidate.py'
      - 'scripts/check_resident_seed_frontend.py'
      - 'scripts/check_transposed_matrix_frontend.py'
      - 'scripts/run_isolated_public_tests.py'
      - 'scripts/build_shared_matrix_recipe.py'
      - 'tests/test_matrix_interface_candidate.py'
      - 'tests/test_isolated_public_tests.py'
      - 'tests/test_shared_matrix_recipe.py'
      - 'tests/test_resident_seed_frontend.py'
      - 'chisel/rope_hardware_oracle/maven-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen2-matrix-interface-frontend-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-frontend:
    runs-on: ubuntu-24.04
    # a2e4: setup/tests ~169s + all frontend stages ~747s; retain upload margin.
    # Includes M1/M2 host numeric checks and M4/M8 cost calibration in one shared budget.
    # Latest observed job ~17 min; retain 20 min overall, numeric wrapper <=120s including cleanup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - name: Fetch immutable production baseline
        run: |
          git fetch --no-tags --depth=1 origin 43440dbad48c8e8af3112c1ae658db3ae64d76eb
          git cat-file -e 43440dbad48c8e8af3112c1ae658db3ae64d76eb:chisel/continuous_prefill/src/main/scala/heteronpu/continuous/MatrixPipeline.scala
          git fetch --no-tags --depth=1 origin 590f8cfd39a1aa5aa2a2dc481eab29d406d899a2
          git cat-file -e 590f8cfd39a1aa5aa2a2dc481eab29d406d899a2:chisel/continuous_prefill/src/main/scala/heteronpu/continuous/MatrixPipeline.scala
          git fetch --no-tags --depth=1 origin fb909e861ab91dfd7ecc44bc3e86245c3e63b029
          git cat-file -e fb909e861ab91dfd7ecc44bc3e86245c3e63b029:chisel/continuous_prefill/src/main/scala/heteronpu/continuous/QwenOwnerProtocol.scala
          git fetch --no-tags --depth=1 origin 825caff3a6c618419c49c7da452e009ce86ae8b5
          git cat-file -e 825caff3a6c618419c49c7da452e009ce86ae8b5:candidates/qwen2_resident_matrix/transposed_owner/TransposedDenseOwner.scala
          git fetch --no-tags --depth=1 origin c761ec824ce2c027a66c22feb4a2154829f9d545
          git cat-file -e c761ec824ce2c027a66c22feb4a2154829f9d545:candidates/qwen2_resident_matrix/transposed_route/manifest.json
          git fetch --no-tags --depth=1 origin 812d858f8e33e1e6da0cac354846465e971aa975
          git cat-file -e 812d858f8e33e1e6da0cac354846465e971aa975:candidates/qwen2_resident_matrix/ffn_fullgroup/precision_pins.json
          git fetch --no-tags --depth=1 origin df18ba25a439fd90c846b22b9aafe992a2a6ae79
          git cat-file -e df18ba25a439fd90c846b22b9aafe992a2a6ae79:candidates/qwen2_resident_matrix/ffn_public/prefix_numerical_receipt.json
          git fetch --no-tags --depth=1 origin 37b7de74431ed79b7e9f3d52d308ed7f46727b7a
          git cat-file -e 37b7de74431ed79b7e9f3d52d308ed7f46727b7a:candidates/qwen2_resident_matrix/ffn_public/fullgraph_numerical_receipt.json
          git fetch --no-tags --depth=1 origin c554e502dfe462d5a0acb7030eff4bb51570bdf2
          git cat-file -e c554e502dfe462d5a0acb7030eff4bb51570bdf2:candidates/qwen2_resident_matrix/ffn_public/delivery_manifest.json
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install public Host packer dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple 'numpy==2.3.5' 'PyYAML==6.0.3'
          PYTHONPATH=src python -c 'from heteronpu.command import Command128; from heteronpu.descriptor_chain import DescriptorRecord'
      - name: Build one shared host Matrix and existing SiLU recipe
        run: |
          python scripts/build_shared_matrix_recipe.py --repo . --out work/matrix-interface-tests/attention-tests
      - name: Independent control contracts and negative identity guards
        shell: bash
        run: |
          python -m unittest discover -s candidates/qwen2_resident_matrix -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/transposed_route -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/transposed_owner -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/transposed_seed -p 'test_*.py' -v
          python candidates/qwen2_resident_matrix/transposed_seed/leaf/test_seed_leaf_contract.py
          python -m unittest discover -s candidates/qwen2_resident_matrix/transposed_down -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/transposed_host -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/ffn_tiles -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/ffn_window -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/ffn_drain -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/ffn_group -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/public_dispatch -p 'test_*.py' -v
          python -O -m unittest discover -s candidates/qwen2_resident_matrix/public_dispatch -p 'test_*.py' -v
          python -m unittest discover -s candidates/qwen2_resident_matrix/ffn_fullgroup -p 'test_*.py' -v
          python scripts/run_isolated_public_tests.py --out work/matrix-interface-tests/public-tests
          python -m unittest discover -s candidates/qwen2_resident_matrix/ffn_attention -p 'test_*.py' -v
          python -m unittest discover -s tests -p test_shared_matrix_recipe.py -v
          python -m unittest discover -s tests -p test_isolated_public_tests.py -v
          python -m unittest discover -s tests -p test_matrix_interface_candidate.py -v
          python -m unittest discover -s tests -p test_resident_seed_frontend.py -v
          python -m unittest candidates.qwen2_resident_matrix.official_bf16.test_chisel_policy candidates.qwen2_resident_matrix.official_bf16.test_frontend candidates.qwen2_resident_matrix.official_bf16.test_workflow -v 2>&1 | tee work/matrix-interface-tests/official-bf16-source-tests.log
      - name: Bounded original PV16 KV numeric bridge
        if: github.run_attempt == 1
        run: |
          deadline=$(python -c 'import time; print(time.monotonic_ns() + 120_000_000_000)')
          python -m unittest candidates.qwen2_resident_matrix.raw_kv_attention.test_model candidates.qwen2_resident_matrix.raw_kv_attention.test_numeric_prepare candidates.qwen2_resident_matrix.raw_kv_attention.test_numeric_ci candidates.qwen2_resident_matrix.raw_kv_attention.test_streaming candidates.qwen2_resident_matrix.raw_kv_attention.test_reference_profile candidates.qwen2_resident_matrix.raw_kv_attention.test_profile_numeric candidates.qwen2_resident_matrix.raw_kv_attention.test_calibration_ci -q
          python -O -m unittest candidates.qwen2_resident_matrix.raw_kv_attention.test_model candidates.qwen2_resident_matrix.raw_kv_attention.test_numeric_prepare candidates.qwen2_resident_matrix.raw_kv_attention.test_numeric_ci candidates.qwen2_resident_matrix.raw_kv_attention.test_streaming candidates.qwen2_resident_matrix.raw_kv_attention.test_reference_profile candidates.qwen2_resident_matrix.raw_kv_attention.test_profile_numeric candidates.qwen2_resident_matrix.raw_kv_attention.test_calibration_ci -q
          python -m candidates.qwen2_resident_matrix.raw_kv_attention.run_numeric_ci --deadline-ns "$deadline" --out work/raw-kv-attention-numeric
          python -m candidates.qwen2_resident_matrix.raw_kv_attention.run_calibration_ci --deadline-ns "$deadline" --out work/raw-kv-attention-calibration
      - name: Compile real source and check CHIRRTL structure
        run: |
          test ! -e work/matrix-interface-frontend
          python scripts/check_matrix_interface_candidate.py --repo . --out work/matrix-interface-frontend --cache work/matrix-interface-jars
          python scripts/check_resident_seed_frontend.py --repo . --out work/matrix-interface-frontend/resident --cache work/matrix-interface-jars
          python scripts/check_transposed_matrix_frontend.py --repo . --out work/matrix-interface-frontend/transposed --cache work/matrix-interface-jars --baseline work/matrix-interface-frontend
          bash chisel/continuous_prefill/scripts/prepare_hardfloat.sh > work/matrix-interface-frontend/hardfloat-source.log
          python candidates/qwen2_resident_matrix/transposed_owner/check_frontend.py --out work/matrix-interface-frontend/transposed-owner --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/transposed_seed/check_frontend.py --out work/matrix-interface-frontend/transposed-seed --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/transposed_down/check_frontend.py --out work/matrix-interface-frontend/transposed-down --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/transposed_host/check_frontend.py --out work/matrix-interface-frontend/transposed-host --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/ffn_tiles/check_frontend.py --out work/matrix-interface-frontend/ffn-tiles --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/ffn_window/check_frontend.py --out work/matrix-interface-frontend/ffn-window --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/ffn_drain/check_frontend.py --out work/matrix-interface-frontend/ffn-drain --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/ffn_group/check_frontend.py --out work/matrix-interface-frontend/ffn-group --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/official_bf16/check_frontend.py --out work/matrix-interface-frontend/official-bf16 --cache work/matrix-interface-jars --hardfloat work/upstream/hardfloat_continuous
          python candidates/qwen2_resident_matrix/dense_block_reduce/check_public_reduction_frontend.py --baseline work/matrix-interface-frontend/official-bf16 --cache work/matrix-interface-jars --out work/matrix-interface-frontend/public-dense-reduction
      - name: Preserve compact source and frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2-matrix-interface-frontend-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            work/matrix-interface-frontend/**/*.json
            work/matrix-interface-frontend/**/*.log
            work/matrix-interface-frontend/**/*.fir
            work/matrix-interface-tests/**/*.json
            work/matrix-interface-tests/**/*.log
            work/raw-kv-attention-numeric/summary.json
            work/raw-kv-attention-numeric/source_hashes.json
            work/raw-kv-attention-calibration/summary.json
            work/raw-kv-attention-calibration/source_hashes.json
