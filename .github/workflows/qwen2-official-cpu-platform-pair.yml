name: qwen2-official-cpu-platform-pair
# Two separately certified fresh reference-only bootstraps. No automatic retry,
# freeze, old-contract PASS, DUT execution, artifact upload or detailed log export.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qwen2-official-cpu-platform-pair.yml
permissions:
  contents: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  reference:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QWEN2_CI_RUNTIME_PROFILE: 'avx2-aten-gemm-v1'
      ATEN_CPU_CAPABILITY: 'avx2'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MKL_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: '${{ github.workspace }}/work/runtime_recovery/site-packages'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Admit both independently reviewed single-invocation certificates
        run: |
          mkdir -p work/qwen2_official_cpu_platform_pair_logs
          python -B -m candidates.qwen2_official_cpu_platform_reference.pair admit 2> work/qwen2_official_cpu_platform_pair_logs/admit-launcher.log
      - name: Install exact official runtime once
        timeout-minutes: 7
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --target work/runtime_recovery/site-packages -r candidates/qwen2_fullblock_ci_prepare/requirements-runtime.txt > work/qwen2_official_cpu_platform_pair_logs/install.log 2>&1 || { echo '{"schema":1,"status":"NEW_REFERENCE_PAIR_INCOMPLETE","phase":"INSTALL","error":"RUNTIME_INSTALL_FAILED"}'; exit 1; }
      - name: Prepare fresh fixed raw inputs and native files once
        timeout-minutes: 3
        run: |
          python -B -m candidates.qwen2_ci_prepare_diagnostic.diagnostic --execute --download > work/qwen2_official_cpu_platform_pair_logs/prepare.log 2>&1 || { echo '{"schema":1,"status":"NEW_REFERENCE_PAIR_INCOMPLETE","phase":"PREPARE","error":"FRESH_PREPARATION_FAILED"}'; exit 1; }
      - name: Capture new01 then validated new02 and compare all 29 exports locally
        timeout-minutes: 5
        run: |
          python -B -m candidates.qwen2_official_cpu_platform_reference.pair capture 2> work/qwen2_official_cpu_platform_pair_logs/capture-launcher.log
