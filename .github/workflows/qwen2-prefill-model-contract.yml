      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/ElementwiseMemoryEngine.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/HostBlockCommands.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/HostBlockTop.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/Qwen2Block.scala'
      - 'config/upstream/weight_headers/qwen2_1p5b/config.json'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/RetainedMatrix.scala'
      - 'rtl/integration/qwen2_matrix_command_endpoint.sv'
      - 'rtl/matrix/bf16_outer_product_array_glue512.sv'
      - 'rtl/matrix/candidates/rev8b_a/bf16_operand_distribution512_rev8b_a_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_context_scheduler5_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_outer_product_array_control5_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_context_tag_pipeline5_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_context_fma_pipeline_lane5_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_context_lane_cluster16_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_cluster_flags_glue32_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_context_front_control5_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_front_to_cluster_broadcast32_rev8b_b_candidate.sv'
      - 'rtl/matrix/candidates/rev8b_b/bf16_outer_product_context_array_rev8b_b_candidate.sv'
      - 'chisel/continuous_prefill/tests/qwen2_block.cpp'
      - 'chisel/continuous_prefill/src/test/resources/c03_3/legacy_layout_vectors.tsv'
      - 'chisel/continuous_prefill/scripts/compare_qwen2_stack_reference.py'
      - 'src/heteronpu/model_geometry.py'
      - 'src/heteronpu/weight_header_contract.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen2-prefill-model-contract-${{ github.sha }}
  cancel-in-progress: false
jobs:
  model-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:scripts'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - name: Fetch immutable arithmetic comparison and source-composer baselines
        run: |
          git fetch --no-tags --depth=1 origin 299949a03876fb561010afb6e1d83097db0ca593
          git cat-file -e 299949a03876fb561010afb6e1d83097db0ca593:chisel/continuous_prefill/tests/qwen2_block.cpp
          # official_bf16 -> ffn_group -> transposed_seed source composition.
          git fetch --no-tags --depth=1 origin 825caff3a6c618419c49c7da452e009ce86ae8b5
          git cat-file -e 825caff3a6c618419c49c7da452e009ce86ae8b5:candidates/qwen2_resident_matrix/transposed_owner/TransposedDenseOwner.scala
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install fixed CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==8.4.2 transformers==4.40.1
      - name: Check model contracts and scalar software recipe without RTL
        shell: bash
        run: |
          python -m py_compile scripts/qwen2_carried_qlinear_rms_diagnostic.py
          python -m pytest -o addopts='' -q tests/test_qwen2_dense_residency_numeric.py
          python -m pytest -o addopts='' -q tests/test_qwen2_transposed_dense.py
          python -m pytest -o addopts='' -q tests/test_qwen2_fullgraph_dataflow.py
          python candidates/qwen2_transposed_dense/fullgraph_dataflow.py summary --out work/qwen2_model_contract/fullgraph_dataflow
          python candidates/qwen2_transposed_dense/compare.py --analytic-only --out work/qwen2_model_contract/transposed_analytic
          python -m pytest -o addopts='' -q tests/test_qwen2_layer0_payload.py tests/test_qwen2_layer0_model_gate.py tests/test_qwen2_block_recipe_model.py tests/test_qwen2_prefill_traffic_bound.py tests/test_qwen2_bf16_materialization_candidate.py tests/test_qwen2_rectangular_attention_model.py tests/test_qwen2_carried_prefill_candidate.py tests/test_qwen2_prefill_resource_schedule.py tests/test_qwen2_shared_sfu_schedule.py tests/test_qwen2_rms_rope_policy_diagnostic.py tests/test_qwen2_rms_rope_prefill_candidate.py tests/test_qwen2_rms_backend_evidence.py
          python scripts/qwen2_prefill_traffic_bound.py --tokens 128 --out work/qwen2_model_contract/m128_bf16_bound.json
          python scripts/qwen2_prefill_traffic_bound.py --tokens 1024 --out work/qwen2_model_contract/m1024_bf16_bound.json
          python scripts/qwen2_prefill_traffic_bound.py --tokens 128 --host-schedule --out work/qwen2_model_contract/m128_host_bound.json
          python scripts/qwen2_prefill_traffic_bound.py --tokens 1024 --host-schedule --out work/qwen2_model_contract/m1024_host_bound.json
          python scripts/qwen2_rectangular_attention_model.py --tokens 128 --contexts 1 --out work/qwen2_model_contract/m128_context1_schedule.json
          python scripts/qwen2_rectangular_attention_model.py --tokens 128 --contexts 5 --out work/qwen2_model_contract/m128_context5_schedule.json
          python scripts/qwen2_rectangular_attention_model.py --tokens 1024 --contexts 1 --out work/qwen2_model_contract/m1024_context1_schedule.json
          python scripts/qwen2_rectangular_attention_model.py --tokens 1024 --contexts 5 --out work/qwen2_model_contract/m1024_context5_schedule.json
          python scripts/qwen2_prefill_resource_schedule.py --tokens 128 --out work/qwen2_model_contract/m128_resource_unbound.json
          python scripts/qwen2_prefill_resource_schedule.py --tokens 1024 --out work/qwen2_model_contract/m1024_resource_unbound.json
          python scripts/qwen2_prefill_resource_schedule.py --tokens 128 --synthetic-profile --out work/qwen2_model_contract/m128_resource_synthetic.json
          python scripts/qwen2_shared_sfu_schedule.py --contexts 2 --out work/qwen2_model_contract/sfu_context2_unbound.json
          python scripts/qwen2_shared_sfu_schedule.py --contexts 1 --divider-latency 12 --divider-ii 13 --out work/qwen2_model_contract/sfu_context1_synthetic.json
          python scripts/qwen2_shared_sfu_schedule.py --contexts 2 --divider-latency 12 --divider-ii 13 --out work/qwen2_model_contract/sfu_context2_synthetic.json
          python scripts/qwen2_shared_sfu_schedule.py --contexts 1 --source-divider-timing --out work/qwen2_model_contract/sfu_context1_source_timing.json
          python scripts/qwen2_shared_sfu_schedule.py --contexts 2 --source-divider-timing --out work/qwen2_model_contract/sfu_context2_source_timing.json
          python scripts/qwen2_shared_sfu_schedule.py --source-timing-audit --out work/qwen2_model_contract/sfu_source_timing_binding.json
          python scripts/qwen2_shared_sfu_schedule.py --contexts 2 --source-divider-timing --source-divider-options 16 --out work/qwen2_model_contract/sfu_context2_d14_candidate.json
          python scripts/qwen2_shared_sfu_schedule.py --source-timing-audit --source-divider-options 16 --out work/qwen2_model_contract/sfu_d14_candidate_binding.json
          python scripts/qwen2_prefill_resource_schedule.py --observed-silu-host-bound --out work/qwen2_model_contract/m128_observed_silu_host_bound.json
          python scripts/qwen2_prefill_resource_schedule.py --tokens 128 --contexts 5 --dense-mapping resident_m128_nc3 --out work/qwen2_model_contract/m128_resident_nc3_unbound.json
          python scripts/build_shared_matrix_recipe.py --repo . --out work/qwen2_model_contract/attention-library
          MATRIX_SERVICE_LIBRARY="$PWD/work/qwen2_model_contract/attention-library/matrix_silu_numeric.so" MATRIX_SERVICE_COMPILE_RECEIPT="$PWD/work/qwen2_model_contract/attention-library/compile.json" QWEN2_ATTENTION_OBSERVATION_OUT="$PWD/work/qwen2_model_contract/attention-observation" python -m unittest discover -s tests -p test_qwen2_attention_observation.py -v
          MATRIX_SERVICE_LIBRARY="$PWD/work/qwen2_model_contract/attention-library/matrix_silu_numeric.so" MATRIX_SERVICE_COMPILE_RECEIPT="$PWD/work/qwen2_model_contract/attention-library/compile.json" QWEN2_PUBLIC_ATTENTION_OBSERVATION_OUT="$PWD/work/qwen2_model_contract/public-attention-observation" python -m unittest discover -s tests -p test_qwen2_public_attention_observation.py -v
          MATRIX_SERVICE_LIBRARY="$PWD/work/qwen2_model_contract/attention-library/matrix_silu_numeric.so" MATRIX_SERVICE_COMPILE_RECEIPT="$PWD/work/qwen2_model_contract/attention-library/compile.json" python -m unittest candidates.qwen2_resident_matrix.official_bf16.test_owners candidates.qwen2_resident_matrix.official_bf16.test_dense_silu candidates.qwen2_resident_matrix.official_bf16.test_execution candidates.qwen2_resident_matrix.official_bf16.test_observation candidates.qwen2_resident_matrix.official_bf16.test_observation_monitoring candidates.qwen2_resident_matrix.official_bf16.test_numeric_guards candidates.qwen2_resident_matrix.official_bf16.test_reference_layout -v 2>&1 | tee work/qwen2_model_contract/official-bf16-tests.log
          MATRIX_SERVICE_LIBRARY="$PWD/work/qwen2_model_contract/attention-library/matrix_silu_numeric.so" MATRIX_SERVICE_COMPILE_RECEIPT="$PWD/work/qwen2_model_contract/attention-library/compile.json" python candidates/qwen2_resident_matrix/dense_block_reduce/run_tests.py --out work/qwen2_model_contract/dense-block-reduce-tests
          python scripts/check_git_payloads.py
      - name: Retain compact source-bound traffic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2-model-contract-${{ github.sha }}
          path: |
            work/qwen2_model_contract/*.json
            work/qwen2_model_contract/official-bf16-tests.log
            work/qwen2_model_contract/dense-block-reduce-tests/
            work/qwen2_model_contract/transposed_analytic/SUMMARY.json
            work/qwen2_model_contract/fullgraph_dataflow/SUMMARY.json
            work/qwen2_model_contract/attention-library/*
            work/qwen2_model_contract/attention-observation/*
            work/qwen2_model_contract/public-attention-observation/
          if-no-files-found: error
          retention-days: 14
