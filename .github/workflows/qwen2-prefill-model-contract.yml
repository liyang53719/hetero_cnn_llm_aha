  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen2-prefill-model-contract.yml'
      - 'scripts/qwen2_layer0_payload.py'
      - 'scripts/collect_qwen2_layer0_payload.py'
      - 'scripts/qwen2_layer0_model_gate.py'
      - 'scripts/qwen2_block_recipe_model.py'
