  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen2-public21-binding-control-${{ github.sha }}
  cancel-in-progress: false
jobs:
  control-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Fetch immutable source identities and metadata dependencies
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 8e0b2bbd35b3fee5ba2ca3e1f37e9274266b7689
          git fetch --no-tags --depth=1 origin 36dd2c473815a931e1f74463e9d43e538c11f2f6
          git cat-file -e 8e0b2bbd35b3fee5ba2ca3e1f37e9274266b7689:chisel/continuous_prefill/src/main/scala/heteronpu/continuous/HostBlockCommands.scala
          git cat-file -e 36dd2c473815a931e1f74463e9d43e538c11f2f6:candidates/qwen2_resident_matrix/public_dispatch/source_pins.json
          python -m pip install --index-url https://pypi.org/simple 'numpy==2.3.5' 'PyYAML==6.0.3'
      - name: Cold source and rejection gates in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/public21-binding-cold
          python -m unittest discover -s candidates/qwen2_public21_binding -p 'test_*.py' -v 2>&1 | tee work/public21-binding-cold/normal.log
          python -O -m unittest discover -s candidates/qwen2_public21_binding -p 'test_*.py' -v 2>&1 | tee work/public21-binding-cold/optimized.log
          python -S candidates/qwen2_public21_binding/run_control.py > work/public21-binding-cold/default.json
      - name: Provision fixed isolated Chisel tools
        run: bash scripts/setup_hetero_chisel_loan_toolchain.sh
      - name: Fresh parser and reduction-coordinator control RTL
        shell: bash
        run: |
          set -euo pipefail
          source work/chisel_toolchain/env.sh
          python candidates/qwen2_public21_binding/run_control.py --run-rtl --out "$PWD/work/public21-binding-control" --toolchain-root "$PWD/work/chisel_toolchain" --hardfloat-source "$HARDFLOAT_SOURCE"
      - name: Preserve bounded control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2-public21-binding-control-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            work/public21-binding-cold/*.log
            work/public21-binding-cold/default.json
            work/public21-binding-control/summary.json
            work/public21-binding-control/fixture_generation.log
            work/public21-binding-control/test.log
            work/public21-binding-control/sources/source_receipt.json
            work/public21-binding-control/rtl/
            work/chisel_toolchain/logs/
