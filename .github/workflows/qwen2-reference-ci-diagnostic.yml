name: qwen2-reference-ci-diagnostic
# One reviewed reference-only diagnostic, activated only by publishing this exact file.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qwen2-reference-ci-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: hetero-exclusive-numeric-bootstrap
  cancel-in-progress: false
jobs:
  reference:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MKL_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: '${{ github.workspace }}/work/runtime_recovery/site-packages'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Admit exact independently reviewed source and budget
        run: |
          mkdir -p work/ci_dut_logs
          env -u ATEN_CPU_CAPABILITY python -B -m candidates.qwen2_fullblock_ci_execution.reference_diagnostic admit 2> work/ci_dut_logs/admit.log || { echo 'Source admission failed.'; exit 1; }
      - name: Install exact official runtime wheels
        timeout-minutes: 7
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --target work/runtime_recovery/site-packages -r candidates/qwen2_fullblock_ci_prepare/requirements-runtime.txt > work/ci_dut_logs/install.log 2>&1 || { echo 'Runtime installation failed.'; exit 1; }
      - name: Prepare fixed inputs and current native identities
        timeout-minutes: 4
        run: |
          env -u ATEN_CPU_CAPABILITY python -B -m candidates.qwen2_ci_prepare_diagnostic.diagnostic --execute --download 2> work/ci_dut_logs/prepare-launcher.log
      - name: Capture official reference and check fixed expectations locally
        timeout-minutes: 3
        run: |
          env -u ATEN_CPU_CAPABILITY python -B -m candidates.qwen2_fullblock_ci_execution.reference_diagnostic capture 2> work/ci_dut_logs/reference.log || { echo 'Official reference failed.'; exit 1; }
