name: qwen2-selected-scala-model-cold

# Python source/control and small Fraction arithmetic tests only.
# No Scala execution, native build, weights, full M128 model or RTL acceptance.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen2-selected-scala-model-cold.yml'
      - 'candidates/qwen2_selected_scala_model/**'
      - 'plans/QWEN2_SELECTED_SCHEDULE_MODEL_20261024_ZH.md'
  pull_request:
    paths:
      - '.github/workflows/qwen2-selected-scala-model-cold.yml'
      - 'candidates/qwen2_selected_scala_model/**'
      - 'plans/QWEN2_SELECTED_SCHEDULE_MODEL_20261024_ZH.md'
permissions:
  contents: read
jobs:
  isolated-cold-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require existing source-only patch utility
        run: patch --version
      - name: Require all 76 cold tests in normal and optimized Python
        shell: bash
        run: |
          python -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import resource
          import subprocess
          import sys
          import time

          root = Path.cwd().resolve()
          package = root / 'candidates/qwen2_selected_scala_model'
          tests = (
              ('test_routing.py', 26),
              ('test_schedule_numeric.py', 10),
              ('test_control_regression.py', 17),
              ('test_prepare_geometry.py', 8),
              ('run_existing_numeric_regressions.py', 15),
          )
          available_cpus = os.sched_getaffinity(0)
          if not available_cpus:
              raise SystemExit('No available CPU for bounded cold tests')
          selected_cpu = min(available_cpus)

          def limits():
              resource.setrlimit(resource.RLIMIT_CPU, (20, 20))
              memory = 256 * 1024 * 1024
              resource.setrlimit(resource.RLIMIT_AS, (memory, memory))
              os.sched_setaffinity(0, {selected_cpu})

          started = time.monotonic()
          totals = []
          for optimized in (False, True):
              total = 0
              for filename, expected in tests:
                  remaining = 120 - (time.monotonic() - started)
                  if remaining <= 0:
                      raise SystemExit('Cold aggregate exceeded 120-second budget')
                  command = [sys.executable, '-I', '-B']
                  if optimized:
                      command.append('-O')
                  command += [str(package / filename), '--source-root', str(root), '-v']
                  completed = subprocess.run(
                      command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, preexec_fn=limits, timeout=min(30, remaining),
                      check=False,
                  )
                  print(f'=== {filename}; optimized={optimized}; expected={expected}', flush=True)
                  print(completed.stdout, end='', flush=True)
                  counts = re.findall(r'^Ran (\d+) tests? in .+s$', completed.stdout, re.MULTILINE)
                  ok_lines = re.findall(r'^OK$', completed.stdout, re.MULTILINE)
                  bad = re.search(r'\b(?:skipped|expected failures|unexpected successes)\b', completed.stdout)
                  if completed.returncode != 0 or counts != [str(expected)] or len(ok_lines) != 1 or bad:
                      raise SystemExit('Cold suite failed, skipped, empty or count-mismatched')
                  total += expected
              if total != 76:
                  raise SystemExit('Cold aggregate count mismatch')
              totals.append(total)
          print(json.dumps({
              'status': 'PASS_COLD_TESTS_ONLY', 'normal_tests': totals[0],
              'optimized_tests': totals[1], 'native_execution': False,
              'scala_execution': False, 'full_m128_acceptance': False,
              'rtl_acceptance': False,
          }, sort_keys=True))
          PY
      - name: Require checkout unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
