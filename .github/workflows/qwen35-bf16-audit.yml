name: qwen35-source-native-bf16-diagnostic-not-acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen35-bf16-audit.yml'
      - 'scripts/run_qwen35_bf16_audit.py'
      - 'src/heteronpu/qwen35_bf16_reference.py'
      - 'tests/test_qwen35_bf16_reference.py'
      - 'config/upstream/**'
      - 'config/model_profiles/**'
      - 'src/heteronpu/pinned*payload.py'
      - 'src/heteronpu/qwen35*reference.py'
      - 'src/heteronpu/model_geometry.py'
      - 'src/heteronpu/weight_header_contract.py'
      - 'src/heteronpu/qwen35_dense_contract.py'
      - 'src/heteronpu/qwen_family_contracts.py'
      - 'scripts/run_qwen35_prefix_chain.py'
      - 'scripts/collect_qwen35*payload.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-diagnostic-not-bf16-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest numpy==2.3.5 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Check reference and fail-closed admission tests
        run: |
          python -m pytest -o addopts='' -q tests/test_qwen35_bf16_reference.py tests/test_pinned_prefix_payload.py tests/test_qwen35_prefix_reference.py
          python -O -m pytest -o addopts='' -q tests/test_qwen35_bf16_reference.py
      - name: Acquire bounded real payloads
        run: |
          python scripts/collect_qwen35_layer0_payload.py --output work/layer0
          python scripts/collect_qwen35_layer3_payload.py --output work/layer3
          python scripts/collect_qwen35_prefix_payload.py --output work/prefix
      - name: Rebuild trusted prefix and collect strict BF16 rejection or acceptance
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          set +e
          python scripts/run_qwen35_bf16_audit.py --payload work/layer3 --upstream work/chain --output work/bf16 --rebuild-layer0 work/layer0 --rebuild-extra work/prefix --require-pass > work/bf16.log 2>&1
          code=$?
          set -e
          cat work/bf16.log
          # Exit 2 means collection succeeded but numerical gate REJECTED.
          # This job validates diagnostic execution, never certifies BF16 or RTL.
          test "$code" -eq 0 -o "$code" -eq 2
          AUDIT_EXIT="$code" python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('work/bf16/result.json').read_text())
          assert r['audit_collection_complete'] is True
          assert int(os.environ['AUDIT_EXIT']) == (0 if r['gate_pass'] else 2)
          assert r['hardware_v0_semantics_accepted'] is False and r['rtl_executed'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"Source-native BF16 diagnostic: {r['status']}\n\n")
              f.write(f"Failed producer comparisons: {len(r['failed_producers'])}. Hardware v0 semantics and actual RTL/MAC90% are NOT accepted.\n")
              f.write('Green workflow means successful evidence collection and tests, not BF16 numerical acceptance.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-native-bf16-diagnostic-not-acceptance-${{ github.sha }}
          path: |
            work/layer0/manifest.json
            work/layer3/manifest.json
            work/prefix/manifest.json
            work/chain/*
            work/bf16/*
            work/bf16.log
          retention-days: 30
          if-no-files-found: warn
