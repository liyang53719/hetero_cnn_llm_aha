name: qwen35-gdn-prefill-model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen35-gdn-prefill-model.yml'
      - 'candidates/qwen35_gdn_prefill/**'
      - 'candidates/qwen2_resident_matrix/transposed_down/model.py'
      - 'candidates/qwen2_resident_matrix/ffn_attention/matrix_service.py'
      - 'candidates/qwen2_resident_matrix/ffn_attention/matrix_numeric.cpp'
      - 'candidates/qwen2_resident_matrix/transposed_down/numeric_smoke.cpp'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/BlockFloat.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnRmsNormOwner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnConv4Owner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnInputPrepOwner.scala'
      - 'chisel/continuous_prefill/config/host_bf16_gdn_descriptor_contract.json'
      - 'config/upstream/qwen3_5_0p8b/modeling_qwen3_5.py'
      - 'scripts/build_shared_matrix_recipe.py'
permissions:
  contents: read
jobs:
  synthetic-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install fixed software arithmetic dependency
        # The pinned payload facade imports heteronpu.config, which requires
        # PyYAML even though this gate only loads JSON tensor metadata.
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.3
      - name: Build original shared Matrix recipe once
        run: python scripts/build_shared_matrix_recipe.py --repo . --out work/qwen35_gdn_model/library
      - name: Run every synthetic suite in an isolated process
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python -m candidates.qwen35_gdn_prefill.run_tests --out work/qwen35_gdn_model/tests
      - name: Retain compact source and result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-gdn-model-${{ github.sha }}
          path: |
            work/qwen35_gdn_model/library/compile.json
            work/qwen35_gdn_model/library/compile.log
            work/qwen35_gdn_model/tests/*.json
            work/qwen35_gdn_model/tests/*.log
          retention-days: 14
