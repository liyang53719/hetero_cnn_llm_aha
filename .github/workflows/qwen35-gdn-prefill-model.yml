name: qwen35-gdn-prefill-model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen35-gdn-prefill-model.yml'
      - 'candidates/qwen35_gdn_prefill/**'
      - 'candidates/qwen35_35b_prefill/**'
      - 'candidates/qwen35_35b_payload/**'
      - 'candidates/qwen35_35b_rms/**'
      - 'candidates/qwen35_35b_conv/**'
      - 'candidates/qwen35_35b_ab/**'
      - 'candidates/qwen35_35b_prep/**'
      - 'candidates/qwen35_35b_projection_reference/**'
      - 'config/upstream/weight_headers/qwen3_5_35b_a3b/**'
      - 'config/model_profiles/qwen3_5_35b_a3b.json'
      - 'src/heteronpu/__init__.py'
      - 'src/heteronpu/config.py'
      - 'src/heteronpu/model_geometry.py'
      - 'src/heteronpu/weight_header_contract.py'
      - 'src/heteronpu/qwen35_dense_contract.py'
      - 'src/heteronpu/pinned_block_payload.py'
      - 'src/heteronpu/pinned_gdn_payload.py'
      - 'src/heteronpu/qwen_family_contracts.py'
      - 'src/heteronpu/abi_validation.py'
      - 'src/heteronpu/cgra_sfu.py'
      - 'src/heteronpu/command.py'
      - 'src/heteronpu/dtypes.py'
      - 'src/heteronpu/kv_engine.py'
      - 'src/heteronpu/matrix_engine.py'
      - 'src/heteronpu/scheduler.py'
      - 'candidates/qwen2_resident_matrix/transposed_down/model.py'
      - 'candidates/qwen2_resident_matrix/dense_block_reduce/**'
      - 'candidates/qwen2_resident_matrix/ffn_tiles/model.py'
      - 'candidates/qwen2_resident_matrix/ffn_tiles/check_numeric.py'
      - 'candidates/qwen2_resident_matrix/ffn_window/model.py'
      - 'candidates/qwen2_resident_matrix/ffn_window/check_numeric.py'
      - 'candidates/qwen2_resident_matrix/ffn_drain/model.py'
      - 'candidates/qwen2_resident_matrix/ffn_drain/check_numeric.py'
      - 'candidates/qwen2_resident_matrix/ffn_group/model.py'
      - 'candidates/qwen2_resident_matrix/ffn_fullgroup/check_numeric.py'
      - 'candidates/qwen2_resident_matrix/ffn_fullgroup/down_driver.py'
      - 'candidates/qwen2_resident_matrix/ffn_public/model.py'
      - 'candidates/qwen2_resident_matrix/ffn_public/execute_numeric.py'
      - 'candidates/qwen2_resident_matrix/ffn_public/prefix_arithmetic.py'
      - 'candidates/qwen2_resident_matrix/ffn_attention/matrix_service.py'
      - 'candidates/qwen2_resident_matrix/ffn_attention/matrix_numeric.cpp'
      - 'candidates/qwen2_resident_matrix/transposed_down/numeric_smoke.cpp'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/BlockFloat.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnRmsNormOwner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnConv4Owner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnInputPrepOwner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnGatedNormOwner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/GdnElementwiseOwner.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/ElementwiseMemoryEngine.scala'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'chisel/continuous_prefill/config/host_bf16_gdn_descriptor_contract.json'
      - 'config/upstream/qwen3_5_0p8b/modeling_qwen3_5.py'
      - 'scripts/build_shared_matrix_recipe.py'
permissions:
  contents: read
jobs:
  synthetic-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install fixed software arithmetic dependency
        # The pinned payload facade imports heteronpu.config, which requires
        # PyYAML even though this gate only loads JSON tensor metadata.
        # The source-only bounded-range acquisition tests use pytest fixtures.
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.3 pytest==8.4.2
      - name: Build original shared Matrix recipe once
        run: python scripts/build_shared_matrix_recipe.py --repo . --out work/qwen35_gdn_model/library
      - name: Build shared Vector16 host adapter once
        run: |
          python - <<'PY'
          import os
          from candidates.qwen35_gdn_prefill.chunk.vector import build_library
          library = build_library('work/qwen35_gdn_model/vector')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('GDN_VECTOR16_LIBRARY=' + str(library) + '\n')
          PY
      - name: Run every synthetic suite in an isolated process
        env: {PYTHONDONTWRITEBYTECODE: '1'}
        run: python -m candidates.qwen35_gdn_prefill.run_tests --out work/qwen35_gdn_model/tests
      - name: Retain compact source and result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-gdn-model-${{ github.sha }}
          path: |
            work/qwen35_gdn_model/library/compile.json
            work/qwen35_gdn_model/library/compile.log
            work/qwen35_gdn_model/vector/*.json
            work/qwen35_gdn_model/tests/*.json
            work/qwen35_gdn_model/tests/*.log
          retention-days: 14
