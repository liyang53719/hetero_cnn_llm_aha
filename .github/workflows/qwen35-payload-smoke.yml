name: qwen35-payload-synthetic-smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen35-payload-smoke.yml'
      - 'src/heteronpu/pinned_block_payload.py'
      - 'src/heteronpu/qwen35_numpy_reference.py'
      - 'src/heteronpu/weight_header_contract.py'
      - 'scripts/collect_qwen35_layer3_payload.py'
      - 'scripts/run_qwen35_layer3_smoke.py'
      - 'tests/test_pinned_block_payload.py'
      - 'config/upstream/**'
      - 'config/model_profiles/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-payload-synthetic-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime and immutable official implementation
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest numpy==2.3.5 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Verify offline rejection tests and bounded real payload
        run: |
          python -m pytest -o addopts='' -q tests/test_pinned_block_payload.py
          python -O -m pytest -o addopts='' -q tests/test_pinned_block_payload.py
          python scripts/collect_qwen35_layer3_payload.py --output work/payload
      - name: Run unmodified official decoder and independent mathematical audit
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python scripts/run_qwen35_layer3_smoke.py --payload work/payload --output work/smoke
          set +e
          python scripts/validate_workload_evidence.py --require-complete > work/replay_admission.log 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'U00.2 OPEN' work/replay_admission.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-layer-numerics-not-rtl-${{ github.sha }}
          path: |
            work/payload/manifest.json
            work/smoke/*
            work/replay_admission.log
          retention-days: 30
          if-no-files-found: warn
