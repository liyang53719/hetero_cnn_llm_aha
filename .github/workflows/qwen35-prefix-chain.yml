name: qwen35-real-embedding-prefix-chain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen35-prefix-chain.yml'
      - 'src/heteronpu/pinned*payload.py'
      - 'src/heteronpu/qwen35*reference.py'
      - 'src/heteronpu/weight_header_contract.py'
      - 'scripts/collect_qwen35*payload.py'
      - 'scripts/run_qwen35_prefix_chain.py'
      - 'tests/test_pinned_prefix_payload.py'
      - 'tests/test_qwen35_prefix_reference.py'
      - 'config/upstream/**'
      - 'config/model_profiles/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-prefix-cold-carried-m128:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest numpy==2.3.5 huggingface-hub==1.33.0 tokenizers==0.23.2 safetensors==0.8.0 'https://github.com/huggingface/transformers/archive/14e738b5d0cc69aa27a95dde272aea41fde44f2f.zip#sha256=15a8ff42ef4fba57ff51034e1cd7d3672dec2bf1cf080134eb69d13c69ee6a2d'
      - name: Check immutable payload and independent-chain rejection tests
        run: |
          python -m pytest -o addopts='' -q tests/test_pinned_prefix_payload.py tests/test_qwen35_prefix_reference.py tests/test_pinned_gdn_payload.py tests/test_qwen35_gdn_numpy_reference.py tests/test_pinned_block_payload.py
          python -O -m pytest -o addopts='' -q tests/test_pinned_prefix_payload.py tests/test_qwen35_prefix_reference.py
      - name: Acquire bounded real slices
        run: |
          python scripts/collect_qwen35_layer0_payload.py --output work/layer0
          python scripts/collect_qwen35_layer3_payload.py --output work/layer3
          python scripts/collect_qwen35_prefix_payload.py --output work/prefix
      - name: Run original TextModel prefix and independent full-chain audit
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python scripts/run_qwen35_prefix_chain.py --payload-layer0 work/layer0 --payload-layer3 work/layer3 --payload-extra work/prefix --output work/chain
          set +e
          python scripts/validate_workload_evidence.py --require-complete > work/replay_admission.log 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'U00.2 OPEN' work/replay_admission.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-embedding-prefix-numerics-not-rtl-${{ github.sha }}
          path: |
            work/layer0/manifest.json
            work/layer3/manifest.json
            work/prefix/manifest.json
            work/chain/*
            work/replay_admission.log
          retention-days: 30
          if-no-files-found: warn
