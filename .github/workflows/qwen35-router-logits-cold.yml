  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen35-router-logits-cold-${{ github.sha }}
  cancel-in-progress: false
jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install metadata packer import dependencies
        run: python -m pip install --index-url https://pypi.org/simple 'numpy==2.3.5' 'PyYAML==6.0.3'
      - name: Cold contracts and explicit external-fixture boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/router-logits-cold
          PYTHONPATH=src python -m unittest candidates.qwen35_35b_router.test_payload candidates.qwen35_35b_router.test_reference candidates.qwen35_35b_router.test_logits -v 2>&1 | tee work/router-logits-cold/normal.log
          PYTHONPATH=src python -O -m unittest candidates.qwen35_35b_router.test_payload candidates.qwen35_35b_router.test_reference candidates.qwen35_35b_router.test_logits -v 2>&1 | tee work/router-logits-cold/optimized.log
          python -S -m candidates.qwen35_35b_router.run_logits --out work/router-logits-cold/normal
          python -O -S -m candidates.qwen35_35b_router.run_logits --out work/router-logits-cold/optimized
          python -S - <<'PY'
          import json
          from pathlib import Path
          for name in ('normal', 'optimized'):
              report = json.loads(Path('work/router-logits-cold', name, 'report.json').read_bytes())
              if report['actual_status'] != 'NOT_EXECUTED' or report['actual_matrix_owner_executed'] is not False:
                  raise SystemExit('cold workflow cannot claim external arithmetic')
              if (report['status'] != 'TEMP_REQUALIFICATION_REQUIRED' or
                      report['cold_source_identity_status'] != 'PASS' or
                      report['historical_actual_pass_inherited'] is not False):
                  raise SystemExit('cold workflow cannot inherit frozen replay qualification')
          PY
      - name: Preserve cold evidence without model payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-router-logits-cold-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            work/router-logits-cold/*.log
            work/router-logits-cold/*/report.json
