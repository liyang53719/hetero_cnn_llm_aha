name: raw-kv-public-m16
# One fresh M16 original Public21 numerical run. No RTL or full29 acceptance.
# Revision 2: canonical JSON receipt comparison and bounded partial validation evidence; same budgets.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/raw-kv-public-m16.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-kv-public-m16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh-public-m16:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Cold launch and linked admission contracts
        timeout-minutes: 1
        run: |
          python -B -m unittest candidates.qwen2_resident_matrix.raw_kv_public_run.test_admission candidates.qwen2_resident_matrix.raw_kv_public_run.test_run_ci -q
          python -B -O -m unittest candidates.qwen2_resident_matrix.raw_kv_public_run.test_admission candidates.qwen2_resident_matrix.raw_kv_public_run.test_run_ci -q
      - name: Single bounded fresh rebuild and original M16 run
        timeout-minutes: 29
        run: python -B -m candidates.qwen2_resident_matrix.raw_kv_public_run.run_ci --execute --checkout-commit '${{ github.sha }}' --private work/raw-kv-public-m16-private --evidence work/raw-kv-public-m16-safe
      - name: Preserve only safe fixed-name evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-kv-public-m16-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            work/raw-kv-public-m16-safe/summary.json
            work/raw-kv-public-m16-safe/progress.json
            work/raw-kv-public-m16-safe/source_hashes.json
