name: raw-kv-public-pair-m128
# Revision 3: qualify a conservative CPU placement before packages; original numeric/dispatch gates unchanged.
# Placement two is allowed only after a validated pre-package CPU_UNSUITABLE.
# At most one setup/numeric attempt: 900s setup,2430s numeric,3420s total. No numerical retries.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/raw-kv-public-pair-m128.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-kv-public-pair-m128-${{ github.ref }}
  cancel-in-progress: false
jobs:
  placement-1:
    if: github.run_attempt == 1
    outputs:
      status: ${{ steps.verdict.outputs.status }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Cold Public linked admission contracts
        timeout-minutes: 2
        run: |
          python -B -m unittest candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_admission candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_prepare candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_run_ci candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_numeric_progress -q
          python -B -O -m unittest candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_admission candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_prepare candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_run_ci candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_numeric_progress -q
      - name: Qualify CPU before packages and run at most one Public attempt
        id: attempt
        continue-on-error: true
        timeout-minutes: 59
        run: python -B -m candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.run_ci --execute --checkout-commit '${{ github.sha }}' --private work/raw-kv-public-pair-m128-private --evidence work/raw-kv-public-pair-m128-safe
      - name: Validate exact placement outcome
        id: verdict
        if: always()
        timeout-minutes: 1
        env:
          ATTEMPT_OUTCOME: '${{ steps.attempt.outcome }}'
        run: |
          status=$(python -B -m candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.run_ci --placement-status --attempt-outcome "$ATTEMPT_OUTCOME" --checkout-commit '${{ github.sha }}' --evidence work/raw-kv-public-pair-m128-safe)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "CPU_UNSUITABLE" ]; then exit 0; fi
          test "$status" = "PASS_FRESH_RECIPE_PUBLIC_M128_OBSERVED_GATES"
      - name: Preserve only safe fixed-name evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-kv-public-pair-m128-${{ github.sha }}-placement-1
          retention-days: 14
          if-no-files-found: error
          path: |
            work/raw-kv-public-pair-m128-safe/summary.json
            work/raw-kv-public-pair-m128-safe/progress.json
            work/raw-kv-public-pair-m128-safe/source_hashes.json
  placement-2:
    needs: placement-1
    if: always() && github.run_attempt == 1 && needs.placement-1.result == 'success' && needs.placement-1.outputs.status == 'CPU_UNSUITABLE'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Cold Public linked admission contracts
        timeout-minutes: 2
        run: |
          python -B -m unittest candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_admission candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_prepare candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_run_ci candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_numeric_progress -q
          python -B -O -m unittest candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_admission candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_prepare candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_run_ci candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.test_numeric_progress -q
      - name: Qualify CPU before packages and run at most one Public attempt
        id: attempt
        continue-on-error: true
        timeout-minutes: 59
        run: python -B -m candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.run_ci --execute --checkout-commit '${{ github.sha }}' --private work/raw-kv-public-pair-m128-private --evidence work/raw-kv-public-pair-m128-safe
      - name: Validate exact placement outcome
        id: verdict
        if: always()
        timeout-minutes: 1
        env:
          ATTEMPT_OUTCOME: '${{ steps.attempt.outcome }}'
        run: |
          status=$(python -B -m candidates.qwen2_resident_matrix.raw_kv_public_recipe_run.run_ci --placement-status --attempt-outcome "$ATTEMPT_OUTCOME" --checkout-commit '${{ github.sha }}' --evidence work/raw-kv-public-pair-m128-safe)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "PASS_FRESH_RECIPE_PUBLIC_M128_OBSERVED_GATES"
      - name: Preserve only safe fixed-name evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-kv-public-pair-m128-${{ github.sha }}-placement-2
          retention-days: 14
          if-no-files-found: error
          path: |
            work/raw-kv-public-pair-m128-safe/summary.json
            work/raw-kv-public-pair-m128-safe/progress.json
            work/raw-kv-public-pair-m128-safe/source_hashes.json
