name: qwen35-experimental-all-products-BF16-rope-RTL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rope-bf16-candidate.yml'
      - 'scripts/materialize_rope_rounding_corpora.py'
      - 'scripts/check_git_payloads.py'
      - 'tests/test_rope_fixture_materialization.py'
      - 'tests/test_git_payload_guard.py'
      - 'rtl/sfu/*bf16*candidate.sv'
      - 'tb/tb_rope_bf16_candidate.sv'
      - 'tb/tb_fp32_to_bf16_candidate.sv'
      - 'scripts/*rope_bf16_candidate*'
      - 'src/heteronpu/rope_bf16_candidate.py'
      - 'tests/test_rope_bf16_candidate*.py'
      - 'config/upstream/qwen3_5_0p8b/rope_bf16_candidate_contract.json'
      - 'tests/fixtures/rope_rounding/**'
      - 'chisel/rope_hardware_oracle/**'
      - 'scripts/generate_rope_hardware_primitives.sh'
      - 'scripts/run_rope_rounding_ablation.py'
      - 'scripts/run_rope_hardware_oracle.py'
      - 'src/heteronpu/rope_hardware_oracle.py'
      - 'integration/gemmini/EmitHeteroFP32Alu.scala'
      - 'integration/gemmini/EmitHeteroFP32Pipelines.scala'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-candidate-component-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest numpy==2.3.5
      - name: Reject tracked payloads and recover pinned historical bytes
        run: |
          python scripts/check_git_payloads.py
          python scripts/materialize_rope_rounding_corpora.py
          python scripts/materialize_rope_rounding_corpora.py --verify-only
      - name: Normal and optimized candidate/old-policy tests
        run: |
          python -m pytest -o addopts='' -q tests/test_rope_fixture_materialization.py tests/test_git_payload_guard.py tests/test_rope_bf16_candidate*.py tests/test_rope_rounding_ablation.py tests/test_rope_hardware_oracle.py
          python -O -m pytest -o addopts='' -q tests/test_rope_fixture_materialization.py tests/test_git_payload_guard.py tests/test_rope_bf16_candidate*.py tests/test_rope_rounding_ablation.py tests/test_rope_hardware_oracle.py
      - name: Actual emitted HardFloat and separate conversion/product/terminal gates
        run: |
          python scripts/run_rope_bf16_candidate.py --output work/rope_bf16_candidate_result
          python - <<'PY'
          import json,os
          r=json.load(open('work/rope_bf16_candidate_result/result.json'))
          summary={k:r[k] for k in ('schema_version', 'status', 'production_policy_changed', 'U00_2_complete', 'U01_complete', 'mac_utilization_measured', 'candidate_RTL_executed', 'historical_hardware_baseline_only', 'model_native_expectations_regenerated', 'native_expectations_regenerated', 'native_model_expectations_regenerated', 'unique_real_pairs', 'unique_real_native_outputs', 'supplemental_real_pair_replays', 'transactions', 'real_pairs_per_stalled_DUT', 'synthetic_pairs_per_stalled_DUT', 'native_products_per_DUT', 'native_outputs_per_DUT', 'PPA_measured', 'memory_packing_or_store_tested', 'full_block_numerical_complete', 'full_block_hardware_oracle_complete', 'actual_shared_l2_fabric_tested', 'BF16_packing_and_byte_masks_tested', 'generic_SFU_owner_integrated', 'Command128_integrated', 'position_coefficient_generation_tested', 'Q8_whole_tensor_command_tested', 'source_sha256', 'fixture_sha256') if k in r}
          summary['rtl_metrics']=[x['metrics'] for x in r['rtl_runs']]
          with open('work/rope_bf16_candidate_result/summary.json','w') as f: json.dump(summary,f,indent=2)
          if r['status'] != 'PASS_EXPERIMENTAL_BF16_ROPE_RTL_COMPONENT_ONLY' or len(r['rtl_runs']) != 4:
              raise SystemExit('candidate gate incomplete')
          if r['production_policy_changed'] or r['PPA_measured'] or r['memory_packing_or_store_tested'] or r['U01_complete'] or r['mac_utilization_measured']:
              raise SystemExit('candidate scope inflated')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Experimental all-products-BF16 RoPE RTL only. Production modules unchanged.\n\n')
              f.write(f"Per stalled DUT: {r['real_pairs_per_stalled_DUT']} immutable real pairs; {r['native_products_per_DUT']} frozen native products and {r['native_outputs_per_DUT']} BF16 outputs bit exact.\n\n")
              f.write(f"Standalone converter cases: {r['converter']['rows']}; all node values and flags checked independently.\n\n")
              for x in r['rtl_runs']: f.write(f"{x['label']}: {x['metrics']}\n\n")
              f.write('Testbench cycles are not MHz/PPA, memory-store integration, complete block or MAC90% acceptance.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-bf16-rope-component-${{ github.sha }}
          path: work/rope_bf16_candidate_result/summary.json
          retention-days: 30
          if-no-files-found: error
