name: qwen35-frozen-rope-software-ablation-not-RTL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rope-rounding-ablation.yml'
      - 'scripts/materialize_rope_rounding_corpora.py'
      - 'scripts/check_git_payloads.py'
      - 'tests/test_rope_fixture_materialization.py'
      - 'tests/test_git_payload_guard.py'
      - 'scripts/*rope*rounding*'
      - 'src/heteronpu/rope_rounding_ablation.py'
      - 'src/heteronpu/rope_hardware_oracle.py'
      - 'src/heteronpu/qwen35_bf16_reference.py'
      - 'tests/test_rope_rounding_ablation.py'
      - 'tests/fixtures/rope_rounding/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-two-corpus-software-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest numpy==2.3.5
      - name: Reject tracked payloads and recover pinned historical bytes
        run: |
          python scripts/check_git_payloads.py
          python scripts/materialize_rope_rounding_corpora.py
          python scripts/materialize_rope_rounding_corpora.py --verify-only
      - name: Normal and optimized fail-closed tests
        run: |
          python -m pytest -o addopts='' -q tests/test_rope_fixture_materialization.py tests/test_git_payload_guard.py tests/test_rope_rounding_ablation.py tests/test_rope_hardware_oracle.py
          python -O -m pytest -o addopts='' -q tests/test_rope_fixture_materialization.py tests/test_git_payload_guard.py tests/test_rope_rounding_ablation.py tests/test_rope_hardware_oracle.py
      - name: Replay unchanged historical inputs and saved native outputs
        run: |
          python scripts/run_rope_rounding_ablation.py --output work/rope_rounding_result
          python - <<'PY'
          import json,os
          r=json.load(open('work/rope_rounding_result/result.json'))
          summary={k:r[k] for k in ('schema_version', 'status', 'production_policy_changed', 'U00_2_complete', 'U01_complete', 'mac_utilization_measured', 'candidate_RTL_executed', 'historical_hardware_baseline_only', 'model_native_expectations_regenerated', 'native_expectations_regenerated', 'native_model_expectations_regenerated', 'unique_real_pairs', 'unique_real_native_outputs', 'supplemental_real_pair_replays', 'transactions', 'real_pairs_per_stalled_DUT', 'synthetic_pairs_per_stalled_DUT', 'native_products_per_DUT', 'native_outputs_per_DUT', 'PPA_measured', 'memory_packing_or_store_tested', 'full_block_numerical_complete', 'full_block_hardware_oracle_complete', 'actual_shared_l2_fabric_tested', 'BF16_packing_and_byte_masks_tested', 'generic_SFU_owner_integrated', 'Command128_integrated', 'position_coefficient_generation_tested', 'Q8_whole_tensor_command_tested', 'source_sha256', 'fixture_sha256') if k in r}
          summary['comparisons']={n:{v:rows[0]['terminal_BF16_vs_frozen_native'] for v,rows in c['metrics'].items()} for n,c in r['corpora'].items()}
          with open('work/rope_rounding_result/summary.json','w') as f: json.dump(summary,f,indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Four software rounding ablations on both immutable historical corpora. No candidate RTL or full-block acceptance.\n\n')
              for corpus,c in r['corpora'].items():
                  for variant,rows in c['metrics'].items():
                      m=rows[0]['terminal_BF16_vs_frozen_native']
                      f.write(f"{corpus} / {variant}: bit differences={m['bit_different']}, max error={m['max_abs_error']}, within unchanged limits={m['pass']}.\n\n")
              f.write('Production arithmetic unchanged; original remote FP32 source-fidelity counterexample still rejected.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-rope-software-ablation-${{ github.sha }}
          path: work/rope_rounding_result/summary.json
          retention-days: 30
          if-no-files-found: error
