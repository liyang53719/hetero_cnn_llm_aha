name: shape-layout-contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shape-layout-contract.yml'
      - 'src/heteronpu/shape_layout_contract.py'
      - 'scripts/generate_shape_layout_vectors.py'
      - 'cpp/shape_layout_oracle.cpp'
      - 'tests/test_shape_layout_contract.py'
      - 'tests/fixtures/block_contracts/*layout*'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/Qwen2Block.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/HostBlockCommands.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/TypedTensorReader.scala'
      - 'chisel/continuous_prefill/src/main/scala/heteronpu/continuous/QwenOwnerProtocol.scala'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-e0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Require independent C++ compiler
        run: g++ --version
      - name: Verify portable vectors and affected software regressions
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_shape_layout_vectors.py --check
          python -m pytest -q tests/test_shape_layout_contract.py tests/test_abi_integer_contract.py tests/test_model_geometry.py tests/test_descriptor_chain.py tests/test_gemmini_descriptor_v2.py tests/test_block_checklist.py
          python -O -m pytest -q tests/test_shape_layout_contract.py
