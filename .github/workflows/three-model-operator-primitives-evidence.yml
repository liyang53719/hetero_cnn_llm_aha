name: three-model-operator-primitives-evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chisel/three_model_operator_primitives/**'
      - 'config/model_operator_inventory_v3_complete.json'
      - 'config/clock_policy_800mhz.json'
      - 'config/qwen2_1p5b_300tps_budget_800mhz.json'
      - 'configs/arch_v0.yaml'
      - 'configs/arch_v1.yaml'
      - 'configs/arch_v2_qwen38_candidate.yaml'
      - 'dc/common_clock_800mhz.tcl'
      - 'scripts/audit_three_model_operator_primitives.py'
      - 'scripts/run_three_model_operator_primitives.sh'
      - 'tests/test_three_model_operator_primitives.py'
      - '.github/workflows/three-model-operator-primitives-evidence.yml'

permissions:
  contents: write

concurrency:
  group: three-model-operator-evidence-main
  cancel-in-progress: true

jobs:
  verify-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Verify source, Chisel behavior and CIRCT emission
        run: |
          chmod +x scripts/run_three_model_operator_primitives.sh
          ROOT_FOR_RESULT="$GITHUB_WORKSPACE" ./scripts/run_three_model_operator_primitives.sh
      - name: Bind evidence to tested source commit
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd()
          source = root / 'work/results/three_model_operator_primitives/result.json'
          coverage = root / 'reports/execution/OPERATOR_PRIMITIVE_COVERAGE_V3.json'
          result = json.loads(source.read_text())
          result['tested_source_git_sha'] = os.environ['TESTED_SHA']
          result['workflow'] = 'three-model-operator-primitives-evidence'
          result['evidence_boundary'] = 'Chisel source/compile/test/emission smoke; not numerical integrated RTL or DC'
          result['operator_counts'] = {
              'qwen2_1p5b': 30,
              'qwen3_5_35b_a3b': 93,
              'qwen3_8_flash_next': 150,
          }
          result['source_coverage_report'] = str(coverage.relative_to(root))
          out = root / 'reports/execution/OPERATOR_PRIMITIVE_SANDBOX_TEST_V3.json'
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit passing evidence to main
        run: |
          git config user.name 'heteronpu-operator-ci'
          git config user.email 'noreply@github.com'
          git add reports/execution/OPERATOR_PRIMITIVE_COVERAGE_V3.json \
                  reports/execution/OPERATOR_PRIMITIVE_SANDBOX_TEST_V3.json
          if git diff --cached --quiet; then
            echo 'Evidence already matches this source gate.'
            exit 0
          fi
          git commit -m 'ci: record three-model Chisel operator source gate [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$local_sha" = "$remote_sha"
