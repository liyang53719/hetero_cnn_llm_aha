精度合同:
  不变原则: BF16乘数、FP32累加；不以新增FP32乘数阵列掩盖误差
  既有批准策略: 普通tensor BF16；OProj/Down结果、attention及末端残差保留FP32，敏感计算按证据保留FP32
  当前差距: 当前Host多处限定A/D为FP32容器，且仅部分Dense B接受原生BF16；不得把当前路径称作普通tensor均BF16
  双参考:
    固定算术参考: 按批准的舍入点、累加顺序、exp/rsqrt配方独立实现；规定为exact的检查逐位一致
    官方语义参考: 固定checkpoint和框架commit，关闭dropout；使用真实上游block输入，保留原生执行精度及全量checkpoint
  阈值: 继承0.002，不放宽；C02必须追到原比较器的归一化公式、分母下限、适用tensor和聚合方式
  禁止: 未确认公式就把0.002解释为任意max-abs或relative阈值；只检查cosine、均值、argmax或Top10
  新模型门限: GDN状态、路由敏感量与QSA索引分别冻结精度和比较规则；有差异必须记录并阻塞对应官方门禁
  离散结果: shape、地址、mask、token/expert索引、tie规则、commit版本、有效长度必须精确
  数值异常: 覆盖正负零、极值、subnormal、NaN/Inf；语义兼容测试与错误检测测试分开
  参考隔离: block起始hidden可从官方上游执行导出并在launch前装入；启动后不得用reference填内部结果、路由或state
