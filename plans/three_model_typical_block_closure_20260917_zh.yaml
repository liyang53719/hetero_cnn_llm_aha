优先级:
  P0: 无条件前置的来源、精度、数据面、形状与状态正确性；不是追求峰值
  P1: 先收口Qwen2官方block，再收口Qwen35两类block；共享GDN/MoE可并行开发
  P2: Qwen38独有路径和整体发布；性能优化与物理工作独立分支门禁，不阻塞已正确的旧配置
  P3: 典型block之外的整网、视觉、MTP及扩展量化
执行规则:
  状态枚举: [待执行, 执行中, 通过, 失败, 阻塞]
  调度: 先满足依赖，再按P0/P1/P2/P3和任务编号选择；依赖未通过不能因优先级更高跳过
  模型局部阻塞: C01/C02等共享任务按模型分别记录子门禁；Q38固定权重缺失只阻塞Q38官方验收，不阻塞已冻结Q2继续推进
  任务门禁含义: 任务所列G编号表示该任务贡献或检查的门禁域；完整block仍需收集所有相关任务证据，不能由单任务满足整个G域
  时间口径: 本规划不承诺工期；实际每任务记录开始结束时间、仿真wall-time、峰值RSS、失败重试；研发工时与RTL周期分开
  开发侧: 完成源代码、独立参考、工具可用时真实Chisel/Verilator测试；不能只提交TODO让本地agent代写
  本地agent: 仅承担沙箱缺失的权重资源、完整长仿真、授权工具与物理签核；不得放宽门限或改变设计凑PASS
  并行: 合同冻结后，Norm/Attention、GDN、MoE独立开发；写main串行并核对HEAD；重型仿真不并发
  泳道: 功能任务优先于同级P01到P04优化/物理任务；这些独立任务不在R00发布依赖闭包内
  产物命名: 任务产物是待生成工件名而非已有文件；新增runner必须先实现再执行，不能只输出同名PASS文件
  每任务通用交付: 源码差异、实际执行命令、退出码、原始日志、比较结果、来源SHA、明确证据等级
  通用失败策略: 立即保留首差异tensor/元素/状态版本与波形窗口；只重跑受影响闭包；不覆盖旧PASS/FAIL
